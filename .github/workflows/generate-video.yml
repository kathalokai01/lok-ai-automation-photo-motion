name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  FORMAT: "short"

jobs:

  generate-photo-motion-video:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 3. FFMPEG
      # ==========================================================

      - name: Install FFmpeg
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg:"
          ffmpeg -version | head -n 1


      # ==========================================================
      # 4. PYTHON DEPENDENCIES
      # ==========================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            pillow \
            edge-tts


      # ==========================================================
      # 5. PREPARE DIRECTORIES
      # ==========================================================

      - name: Prepare output directories
        shell: bash
        run: |
          set -e

          mkdir -p output/story
          mkdir -p output/scenes
          mkdir -p output/narration
          mkdir -p output/visuals
          mkdir -p output/photo_motion
          mkdir -p output/parts
          mkdir -p output/videos
          mkdir -p output/thumbnails
          mkdir -p output/config


      # ==========================================================
      # 6. READ INPUT
      # ==========================================================

      - name: Read topic
        shell: bash
        run: |
          set -e

          if [ -f "Input/topic.txt" ]; then
            echo "=============================="
            echo "INPUT TOPIC"
            echo "=============================="

            cat Input/topic.txt

            echo
          else
            echo "Input/topic.txt not found."
            exit 1
          fi


      # ==========================================================
      # 7. GENERATE STORY PLAN
      # ==========================================================

      - name: Generate story plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/generate_story_plan.py


      # ==========================================================
      # 8. GENERATE STORY
      # ==========================================================

      - name: Generate story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/generate_story.py


      # ==========================================================
      # 9. GENERATE AI STORY
      # ==========================================================

      - name: Generate AI story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/generate_ai_story.py


      # ==========================================================
      # 10. SELECT GEMINI MODEL
      # ==========================================================

      - name: Select Gemini model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/select_gemini_model.py || true


      # ==========================================================
      # 11. GEMINI TEST
      # ==========================================================

      - name: Test Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/test_gemini.py || true


      # ==========================================================
      # 12. CHARACTER BIBLE
      # ==========================================================

      - name: Generate character bible
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/generate_character_bible.py


      # ==========================================================
      # 13. GENERATE SCENES
      # ==========================================================

      - name: Generate scenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/generate_scenes.py


      # ==========================================================
      # 14. GENERATE NARRATION JOBS
      # ==========================================================

      - name: Generate narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/generate_narration.py


      # ==========================================================
      # 15. GENERATE TTS
      # ==========================================================

      - name: Generate Hindi TTS
        shell: bash
        run: |
          set -e

          python scripts/generate_tts.py


      # ==========================================================
      # 16. PREPARE VISUALS
      # ==========================================================

      - name: Prepare Photo Motion visual jobs
        shell: bash
        run: |
          set -e

          python scripts/generate_visuals.py


      # ==========================================================
      # 17. CHECK SCENE IMAGES
      # ==========================================================

      - name: Check scene images
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CHECKING PHOTO MOTION INPUT IMAGES"
          echo "=============================================="

          COUNT=$(find output/visuals \
            -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
            \) | wc -l)

          echo "Images found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo
            echo "ERROR: No scene images found."
            echo
            echo "Photo Motion requires scene images in:"
            echo "output/visuals/"
            echo
            echo "The workflow intentionally does not call"
            echo "a paid image-generation API."
            echo
            echo "No fake video will be produced."
            exit 1
          fi

          echo
          echo "Scene images:"
          find output/visuals \
            -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
            \) \
            | sort


      # ==========================================================
      # 18. PHOTO MOTION
      # ==========================================================

      - name: Create Photo Motion scene videos
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PHOTO MOTION"
          echo "=============================================="

          python scripts/photo_motion.py


      # ==========================================================
      # 19. CHECK PHOTO MOTION OUTPUT
      # ==========================================================

      - name: Check generated scene videos
        shell: bash
        run: |
          set -e

          COUNT=$(find output/photo_motion \
            -type f \
            -iname "*.mp4" \
            | wc -l)

          echo "Scene videos: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Photo Motion produced no videos."
            exit 1
          fi

          find output/photo_motion \
            -type f \
            -iname "*.mp4" \
            | sort


      # ==========================================================
      # 20. RENDER FINAL VIDEO
      # ==========================================================

      - name: Render final video
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL VIDEO RENDER"
          echo "=============================================="

          python scripts/render_video.py


      # ==========================================================
      # 21. GENERATE THUMBNAIL
      # ==========================================================

      - name: Generate thumbnail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          python scripts/generate_thumbnail.py || true


      # ==========================================================
      # 22. CREATE YOUTUBE METADATA
      # ==========================================================

      - name: Create YouTube metadata
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")

          topic_file = root / "Input" / "topic.txt"

          topic = ""

          if topic_file.exists():
              topic = topic_file.read_text(
                  encoding="utf-8"
              ).strip()

          if not topic:
              topic = "Katha Lok AI Story"

          output = root / "output"

          metadata = output / "youtube_metadata.txt"

          text = f"""KATHA LOK AI — YOUTUBE METADATA

          TITLE
          {topic}

          DESCRIPTION
          {topic}

          A cinematic Hindi story created by Katha Lok AI.

          FORMAT
          {__import__("os").environ.get("FORMAT", "short")}

          LANGUAGE
          Hindi

          CATEGORY
          Entertainment

          HASHTAGS
          #KathaLokAI #HindiStory #AIStory #HindiKahani
          """

          metadata.write_text(
              text.strip() + "\n",
              encoding="utf-8"
          )

          print(
              "Created:",
              metadata
          )
          PY


      # ==========================================================
      # 23. CREATE FINAL ZIP
      # ==========================================================

      - name: Create final output ZIP
        shell: bash
        run: |
          set -e

          ZIP_NAME="katha-lok-ai-photo-motion-${GITHUB_RUN_NUMBER}.zip"

          rm -f "$ZIP_NAME"

          zip -r "$ZIP_NAME" \
            output/videos \
            output/parts \
            output/photo_motion \
            output/visuals \
            output/thumbnails \
            output/story \
            output/scenes \
            output/narration \
            output/youtube_metadata.txt \
            output/config \
            2>/dev/null || true

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: Final ZIP was not created."
            exit 1
          fi

          echo "FINAL ZIP:"
          ls -lh "$ZIP_NAME"


      # ==========================================================
      # 24. UPLOAD FINAL ARTIFACT
      # ==========================================================

      - name: Upload final video package
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-${{ github.run_number }}
          path: |
            katha-lok-ai-photo-motion-${{ github.run_number }}.zip
            output/videos/**
            output/parts/**
            output/photo_motion/**
            output/thumbnails/**
            output/youtube_metadata.txt
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # 25. UPLOAD DEBUG / JOB DATA
      # ==========================================================

      - name: Upload pipeline data
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-data-${{ github.run_number }}
          path: |
            output/story/**
            output/scenes/**
            output/visuals/**
            output/narration/**
            output/photo_motion/**
          if-no-files-found: warn
          retention-days: 7


      # ==========================================================
      # 26. FINAL STATUS
      # ==========================================================

      - name: Final status
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "KATHA LOK AI — PHOTO MOTION COMPLETE"
          echo "============================================================"
          echo
          echo "Repository : PHOTO MOTION"
          echo "Engine     : FFmpeg Photo Motion"
          echo "Wan2GP     : DISABLED"
          echo "Colab      : NOT REQUIRED"
          echo
          echo "Motion:"
          echo "  Zoom In"
          echo "  Zoom Out"
          echo "  Pan Left"
          echo "  Pan Right"
          echo "  Subtle Camera Motion"
          echo
          echo "Final package:"
          echo "  katha-lok-ai-photo-motion-${GITHUB_RUN_NUMBER}.zip"
          echo
          echo "Download from:"
          echo "  GitHub Actions → Artifacts"
          echo
          echo "============================================================"

