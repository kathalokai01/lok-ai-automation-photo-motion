name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      ALLOW_BILLABLE_PROVIDERS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow edge-tts gradio_client

      - name: Check input
        shell: bash
        run: |
          set -e
          test -f "Input/topic.txt" || {
            echo "ERROR: Input/topic.txt not found"
            exit 1
          }
          cat "Input/topic.txt"

      - name: Select Gemini model
        run: python scripts/select_gemini_model.py

      - name: Test selected Gemini model
        run: python scripts/test_gemini.py

      - name: Verify selected model file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/config/selected_model.json")
          if not path.is_file():
              raise SystemExit("ERROR: Selected model file is missing")

          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("status") != "selected" or not data.get("model"):
              raise SystemExit("ERROR: Selected model file is invalid")

          print("Selected Gemini model:", data["model"])
          PY

      - name: Generate story plan
        run: python scripts/generate_story_plan.py

      - name: Generate story
        run: python scripts/generate_story.py

      - name: Generate AI story
        run: python scripts/generate_ai_story.py

      - name: Generate character bible
        run: python scripts/generate_character_bible.py

      - name: Generate scenes
        run: python scripts/generate_scenes.py

      - name: Generate narration jobs
        run: python scripts/generate_narration.py

      - name: Prepare captions in selected language
        run: python scripts/prepare_captions.py

      - name: Generate Hindi TTS
        run: python scripts/generate_tts.py

      - name: Prepare visual jobs
        run: python scripts/generate_visuals.py

      - name: Generate free realistic scene images
        run: python scripts/free_image_generator.py

      - name: Verify generated images
        shell: bash
        run: |
          set -e
          test -d "output/visuals" || {
            echo "ERROR: output/visuals does not exist"
            exit 1
          }

          COUNT=$(find output/visuals -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            | wc -l)

          echo "Image count: $COUNT"
          test "$COUNT" -gt 0 || {
            echo "ERROR: No scene images generated"
            exit 1
          }

          find output/visuals -maxdepth 2 -type f -print

      - name: Create Photo Motion scene videos
        run: python scripts/photo_motion.py

      - name: Render final video
        run: python scripts/render_video.py

      - name: Generate thumbnail
        run: python scripts/generate_thumbnail.py || true

      - name: Create dynamic YouTube metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          output = Path("output")
          output.mkdir(parents=True, exist_ok=True)

          topic_path = Path("Input/topic.txt")
          topic = topic_path.read_text(encoding="utf-8").strip() if topic_path.exists() else ""
          topic = re.sub(r"\s+", " ", topic)

          title_file = output / "story" / "final_title.txt"
          story_title = ""
          if title_file.is_file():
              story_title = title_file.read_text(encoding="utf-8").strip().splitlines()[0]

          title = re.sub(
              r"\s+", " ",
              story_title or topic or "Katha Lok AI Hindi Story"
          ).strip()[:100]

          story_file = output / "story" / "story.json"
          story_text = ""
          if story_file.is_file():
              try:
                  data = json.loads(story_file.read_text(encoding="utf-8"))
                  chunks = []
                  for part in data.get("parts", []):
                      for scene in part.get("scenes", []):
                          narration = scene.get("narration", "")
                          if narration:
                              chunks.append(str(narration).strip())
                  story_text = " ".join(chunks)
              except (OSError, ValueError, TypeError):
                  story_text = ""

          story_text = re.sub(r"\s+", " ", story_text).strip()
          description_story = story_text[:2500]
          if len(story_text) > 2500:
              description_story = description_story.rsplit(" ", 1)[0] + "..."

          if description_story:
              description = (
                  f"{title}\n\n{description_story}\n\n"
                  "Watch the story till the end and share your thoughts in the comments."
              )
          else:
              description = (
                  f"{title}\n\n"
                  f"Watch this Hindi story from Katha Lok AI, based on: {topic or title}.\n\n"
                  "Share your thoughts in the comments."
              )

          words = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+",
              f"{title} {topic} {story_text[:5000]}"
          )
          dynamic_tags = []
          seen = set()
          for word in words:
              word = word.strip()
              key = word.casefold()
              if len(word) >= 3 and key not in seen:
                  seen.add(key)
                  dynamic_tags.append(word)

          fixed_tags = [
              "Katha Lok AI",
              "Hindi story",
              "Hindi kahani",
              "Hindi storytelling"
          ]
          tags = []
          for tag in dynamic_tags + fixed_tags:
              if tag.casefold() not in {x.casefold() for x in tags}:
                  tags.append(tag)
          tags = tags[:20]

          title_words = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+", title
          )
          title_hashtag = "".join(title_words[:3])
          hashtags = ["#KathaLokAI", "#HindiKahani"]
          if title_hashtag and (
              "#" + title_hashtag
          ).casefold() not in {x.casefold() for x in hashtags}:
              hashtags.append("#" + title_hashtag)

          description += "\n\n" + " ".join(hashtags)
          metadata = (
              f"Title:\n{title}\n\n"
              f"Description:\n\n{description}\n\n"
              f"Tags:\n{', '.join(tags)}\n"
          )

          path = output / "youtube_metadata.txt"
          path.write_text(metadata, encoding="utf-8")
          print("Created:", path)
          print(metadata)
          PY

      - name: Check final output
        shell: bash
        run: |
          set -e
          find output -maxdepth 4 -type f -print

          expected="output/videos/katha_lok_ai_final.mp4"
          if [ ! -s "$expected" ]; then
            echo "ERROR: Expected final video is missing or empty: $expected"
            exit 1
          fi

          if [ ! -s "output/youtube_metadata.txt" ]; then
            echo "ERROR: YouTube metadata is missing or empty"
            exit 1
          fi

          if [ ! -s "output/captions/captions.json" ]; then
            echo "ERROR: Prepared captions file is missing or empty"
            exit 1
          fi

      - name: Create final ZIP
        shell: bash
        run: |
          set -e
          cd output
          zip -r ../katha-lok-ai-photo-motion-output.zip .
          cd ..
          ls -lh katha-lok-ai-photo-motion-output.zip

      - name: Upload final output
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-output
          path: |
            output/**
            katha-lok-ai-photo-motion-output.zip
          if-no-files-found: error
          retention-days: 7