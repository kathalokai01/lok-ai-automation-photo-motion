          from pathlib import Path
          from scripts.story_quality_validator import validate_story_output
          import json

          story = json.loads(Path("output/story/story.json").read_text(encoding="utf-8"))
          plan = json.loads(Path("output/story/story_plan.json").read_text(encoding="utf-8"))
