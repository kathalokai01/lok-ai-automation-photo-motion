      - name: Package story-specific output
        id: package
        shell: bash
        run: |
          set -euo pipefail

          python scripts/package_output.py

          test -s output/package_manifest.json
          test -s output/package_archive_name.txt

          ARCHIVE="$(tr -d '\r\n' < output/package_archive_name.txt)"
          test -n "$ARCHIVE"
          test -s "$ARCHIVE"

          python - "$ARCHIVE" <<'PY'
          import hashlib
          import json
          import re
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          manifest_path = Path("output/package_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          mode = manifest.get("format")
          slug = manifest.get("story_slug")
          root = manifest.get("package_root")
          parts = manifest.get("parts")

          if mode not in {"short", "full"}:
              raise SystemExit("Invalid package FORMAT.")

          if not isinstance(slug, str) or not slug:
              raise SystemExit("Story slug is missing.")

          if not re.fullmatch(r"[\w-]{1,100}", slug, flags=re.UNICODE):
              raise SystemExit("Story slug contains invalid characters.")

          if root != f"{slug}-{mode}":
              raise SystemExit("Package root does not match story and FORMAT.")

          if archive.name != manifest.get("archive"):
              raise SystemExit("Archive name and package manifest disagree.")

          if archive.name != f"katha-lok-{slug}-{mode}-output.zip":
              raise SystemExit("Archive name is not story-specific.")

          if not isinstance(parts, int) or isinstance(parts, bool) or parts < 1:
              raise SystemExit("Invalid actual PARTS.")

          if manifest.get("configured_parts") != parts:
              raise SystemExit("Actual PARTS and configured PARTS disagree.")

          if manifest.get("status") != "completed":
              raise SystemExit("Package status is not completed.")

          if manifest.get("part_videos_only") is not True:
              raise SystemExit("Package must contain Part videos only.")

          if manifest.get("combined_video_included") is not False:
              raise SystemExit("Combined video must not be included.")

          if manifest.get("format_alias_included") is not False:
              raise SystemExit("Format alias must not be included.")

          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          if digest.hexdigest() != manifest.get("archive_sha256"):
              raise SystemExit("Archive SHA256 mismatch.")

          if archive.stat().st_size != manifest.get("archive_bytes"):
              raise SystemExit("Archive byte count mismatch.")

          if manifest.get("zip_integrity") != "valid":
              raise SystemExit("Package ZIP integrity is not valid.")

          if manifest.get("manifest_zip_consistency") != "valid":
              raise SystemExit("Package manifest/ZIP consistency is not valid.")

          with zipfile.ZipFile(archive, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")

              names = zf.namelist()

              if not names or len(names) != len(set(names)):
                  raise SystemExit("ZIP is empty or contains duplicate members.")

              prefix = root + "/"
              if any(not name.startswith(prefix) for name in names):
                  raise SystemExit("Every ZIP member must be inside the story root.")

              for name in names:
                  path = PurePosixPath(name)
                  if (
                      path.is_absolute()
                      or "\\" in name
                      or any(part in {"", ".", ".."} for part in path.parts)
                  ):
                      raise SystemExit(f"Unsafe ZIP member: {name}")

              embedded_path = f"{root}/package_manifest.json"
              render_path = f"{root}/scene_renders/render_manifest.json"

              if embedded_path not in names or render_path not in names:
                  raise SystemExit("Embedded package/render manifest is missing.")

              embedded = json.loads(zf.read(embedded_path).decode("utf-8"))

              if embedded.get("status") != "completed":
                  raise SystemExit("Embedded package manifest is incomplete.")

              if embedded.get("format") != mode or embedded.get("parts") != parts:
                  raise SystemExit("Embedded package FORMAT/PARTS mismatch.")

              if (
                  embedded.get("story_slug") != slug
                  or embedded.get("package_root") != root
              ):
                  raise SystemExit("Embedded package story identity mismatch.")

              videos = {
                  name for name in names
                  if PurePosixPath(name).suffix.lower()
                  in {".mp4", ".mov", ".mkv", ".webm"}
              }

              expected = {
                  f"{root}/parts/{slug}-part-{number:02d}.mp4"
                  for number in range(1, parts + 1)
              }

              if videos != expected:
                  raise SystemExit(
                      "Story Part videos mismatch: "
                      f"expected={sorted(expected)}, found={sorted(videos)}"
                  )

              if f"{root}/{slug}-thumbnail.jpg" not in names:
                  raise SystemExit("Story-named thumbnail is missing.")

          print("PACKAGE VERIFIED")
          print("FORMAT:", mode)
          print("STORY:", manifest.get("story_title"))
          print("PARTS:", parts)
          print("ZIP:", archive.name)
          PY

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Verify final package and archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="${{ steps.package.outputs.archive }}"
          test -n "$ARCHIVE"
          test -s "$ARCHIVE"
          test -s output/package_manifest.json

          python - "$ARCHIVE" <<'PY'

          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          manifest = json.loads(
              Path("output/package_manifest.json").read_text(encoding="utf-8")
          )

          slug = manifest.get("story_slug")
          mode = manifest.get("format")
          root = manifest.get("package_root")
          parts = manifest.get("parts")

          if not isinstance(slug, str) or not slug:
              raise SystemExit("Missing story slug.")

          if mode not in {"short", "full"} or root != f"{slug}-{mode}":
              raise SystemExit("Invalid package root/FORMAT.")

          if archive.name != f"katha-lok-{slug}-{mode}-output.zip":
              raise SystemExit("Final ZIP name does not match story and FORMAT.")

          if archive.name != manifest.get("archive"):
              raise SystemExit("Final ZIP and manifest archive names disagree.")

          if not isinstance(parts, int) or isinstance(parts, bool) or parts < 1:
              raise SystemExit("Invalid actual PARTS.")

          if parts != manifest.get("configured_parts"):
              raise SystemExit("Actual PARTS mismatch.")

          if manifest.get("status") != "completed":
              raise SystemExit("Package is incomplete.")

          if manifest.get("part_videos_only") is not True:
              raise SystemExit("Part-only package guarantee failed.")

          if manifest.get("combined_video_included") is not False:
              raise SystemExit("Combined video is forbidden.")

          if manifest.get("format_alias_included") is not False:
              raise SystemExit("Format alias is forbidden.")

          if manifest.get("zip_integrity") != "valid":
              raise SystemExit("ZIP integrity is invalid.")

          if manifest.get("manifest_zip_consistency") != "valid":
              raise SystemExit("Manifest/ZIP consistency is invalid.")

          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          if digest.hexdigest() != manifest.get("archive_sha256"):
              raise SystemExit("Final ZIP SHA256 mismatch.")

          if archive.stat().st_size != manifest.get("archive_bytes"):
              raise SystemExit("Final ZIP size mismatch.")

          with zipfile.ZipFile(archive, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")

              names = zf.namelist()

              if not names or len(names) != len(set(names)):
                  raise SystemExit("ZIP is empty or contains duplicate entries.")

              if any(not name.startswith(root + "/") for name in names):
                  raise SystemExit("ZIP contains a file outside the story root.")

              for name in names:
                  path = PurePosixPath(name)
                  if (
                      path.is_absolute()
                      or "\\" in name
                      or any(part in {"", ".", ".."} for part in path.parts)
                  ):
                      raise SystemExit(f"Unsafe ZIP member: {name}")

              embedded_name = f"{root}/package_manifest.json"
              render_name = f"{root}/scene_renders/render_manifest.json"

              if embedded_name not in names or render_name not in names:
                  raise SystemExit("Required embedded manifests are missing.")

              embedded = json.loads(zf.read(embedded_name).decode("utf-8"))

              if (
                  embedded.get("status") != "completed"
                  or embedded.get("format") != mode
                  or embedded.get("parts") != parts
                  or embedded.get("story_slug") != slug
                  or embedded.get("package_root") != root
              ):
                  raise SystemExit("Embedded manifest identity is inconsistent.")

              videos = {
                  name for name in names
                  if PurePosixPath(name).suffix.lower()
                  in {".mp4", ".mov", ".mkv", ".webm"}
              }

              expected = {
                  f"{root}/parts/{slug}-part-{number:02d}.mp4"
                  for number in range(1, parts + 1)
              }

              if videos != expected:
                  raise SystemExit(
                      "ZIP contains missing, extra or wrongly named Part videos."
                  )

              if f"{root}/{slug}-thumbnail.jpg" not in names:
                  raise SystemExit("Story-named thumbnail is missing.")

          print("FINAL PACKAGE VERIFIED")
          print("FORMAT:", mode)
          print("PARTS:", parts)
          print("STORY:", manifest.get("story_title"))
          print("ZIP:", archive.name)
          PY

      - name: Upload final story-named ZIP only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-output-${{ github.run_id }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save resumable checkpoint
        if: always() && steps.fingerprints.outputs.input_hash != ''
        shell: bash
        env:
          INPUT_HASH: ${{ steps.fingerprints.outputs.input_hash }}
          PIPELINE_HASH: ${{ steps.fingerprints.outputs.pipeline_hash }}
        run: |
          set -euo pipefail

          mkdir -p output

          python - <<'PY'
          import json
          import os
          import re
          import tempfile
          from pathlib import Path

          from scripts.input_config import (
              load_and_validate,
              get_format,
              get_parts_range,
              get_scenes_range,
              get_selected_parts,
          )

          config = load_and_validate("Input/topic.txt")
          mode = str(get_format(config)).strip().lower()
          minimum, maximum = get_parts_range(config)
          scenes_min, scenes_max = get_scenes_range(config)

          try:
              selected = get_selected_parts(config, required=False)
          except Exception as exc:
              print("Checkpoint skipped: cannot read selected PARTS:", exc)
              raise SystemExit(0)

          if selected is None:
              print("Checkpoint skipped: actual PARTS is not selected.")
              raise SystemExit(0)

          actual = int(selected)
          if not minimum <= actual <= maximum:
              raise SystemExit("Cannot checkpoint invalid actual PARTS.")

          title = str(
              config.get("TITLE") or config.get("TOPIC") or ""
          ).strip()

          story_path = Path("output/story/story.json")
          if story_path.is_file():
              try:
                  story = json.loads(
                      story_path.read_text(encoding="utf-8-sig")
                  )
                  if isinstance(story, dict):
                      title = str(
                          story.get("final_title")
                          or story.get("generated_title")
                          or story.get("story_title")
                          or story.get("title")
                          or title
                      ).strip()
              except (OSError, ValueError):
                  pass

          slug = re.sub(
              r"[^\w\s-]", "", title.lower(), flags=re.UNICODE
          )
          slug = re.sub(r"[\s_-]+", "-", slug).strip("-")[:100]

          if not slug:
              print("Checkpoint skipped: story naming key is unavailable.")
              raise SystemExit(0)

          context = {
              "schema_version": 2,
              "format": mode,
              "parts_min": minimum,
              "parts_max": maximum,
              "scenes_min": scenes_min,
              "scenes_max": scenes_max,
              "actual_parts": actual,
              "naming_key": slug,
          }

          destination = Path("output/.resume-context.json")
          fd, temporary_name = tempfile.mkstemp(
              prefix=".resume-context-",
              suffix=".tmp",
              dir=str(destination.parent),
          )

          try:
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  json.dump(context, handle, ensure_ascii=False, indent=2)
                  handle.write("\n")
                  handle.flush()
                  os.fsync(handle.fileno())

              os.replace(temporary_name, destination)
          except Exception:
              Path(temporary_name).unlink(missing_ok=True)
              raise
          PY

          printf '%s\n' "$INPUT_HASH" > output/.resume-input.sha256
          printf '%s\n' "$PIPELINE_HASH" > output/.resume-pipeline.sha256
          sha256sum scripts/generate_story.py | awk '{print $1}' > output/.resume-story-code.sha256

          python - <<'PY'
          import stat
          import zipfile
          from pathlib import Path

          root = Path("output")
          archive = Path("checkpoint.zip")
          temporary = Path("checkpoint.zip.tmp")
          temporary.unlink(missing_ok=True)

          if not root.is_dir():
              raise SystemExit("Output directory is unavailable.")

          files = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"Refusing checkpoint symlink: {path}")
              if path.is_file():
                  files.append(path)

          if not files:
              raise SystemExit("No output files available for checkpoint.")

          with zipfile.ZipFile(
              temporary,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=3,
              allowZip64=True,
          ) as zf:
              for path in files:
                  relative = path.as_posix()
                  if (
                      relative.startswith("/")
                      or ".." in Path(relative).parts
                  ):
                      raise SystemExit(
                          f"Unsafe checkpoint path: {relative}"
                      )

                  info = zipfile.ZipInfo(relative)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o600) << 16

                  with path.open("rb") as source:
                      with zf.open(info, "w") as destination:
                          while True:
                              chunk = source.read(1024 * 1024)
                              if not chunk:
                                  break
                              destination.write(chunk)

          with zipfile.ZipFile(temporary, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(
                      f"Checkpoint ZIP verification failed: {bad}"
                  )

          temporary.replace(archive)

          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("Checkpoint ZIP was not created.")

          print("Checkpoint saved:", archive.stat().st_size, "bytes")
          print("Checkpoint files:", len(files))
          PY

      - name: Upload resumable checkpoint
        if: always() && steps.fingerprints.outputs.input_hash != ''
        uses: actions/upload-artifact@v4
        with:
          name: katha-photo-motion-checkpoint-${{ github.run_id }}
          path: checkpoint.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

