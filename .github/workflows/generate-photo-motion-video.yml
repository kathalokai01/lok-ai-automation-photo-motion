name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: katha-photo-motion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
      FISH_TTS_MODEL: ${{ vars.FISH_TTS_MODEL }}

      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}

      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}

      FINEVOICE_API_KEY: ${{ secrets.FINEVOICE_API_KEY }}
      FINEVOICE_VOICE_ID: ${{ secrets.FINEVOICE_VOICE_ID }}

      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_TTS_VOICE_ID: ${{ secrets.MINIMAX_TTS_VOICE_ID }}
      MINIMAX_TTS_MODEL: ${{ vars.MINIMAX_TTS_MODEL }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

      POLLINATIONS_FREE_IMAGE_MODELS: "black-forest-labs/flux.1-schnell,tongyi-mai/z-image-turbo,lykon/dreamshaper-8-lcm"
      ALLOW_BILLABLE_PROVIDERS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate required files and input configuration
        shell: bash
        run: |
          set -euo pipefail

          test -s Input/topic.txt
          test -s requirements.txt
          test -s .github/workflows/generate-photo-motion-video.yml

          required_files=(
            scripts/input_config.py
            scripts/story_length_policy.py
            scripts/select_gemini_model.py
            scripts/generate_story_plan.py
            scripts/generate_story.py
            scripts/validate_story_length.py
            scripts/verify_story.py
            scripts/generate_ai_story.py
            scripts/generate_character_bible.py
            scripts/generate_scenes.py
            scripts/generate_narration.py
            scripts/prepare_captions.py
            scripts/generate_tts.py
            scripts/generate_flow_music.py
            scripts/generate_visuals.py
            scripts/free_image_generator.py
            scripts/prepare_visuals.py
            scripts/generate_depth_maps.py
            scripts/depth_parallax.py
            scripts/photo_motion.py
            scripts/generate_sound_design.py
            scripts/validate_sfx_timing.py
            scripts/render_video.py
            scripts/install_caption_fonts.py
            scripts/preview_caption_fonts.py
            scripts/burn_captions.py
            scripts/generate_thumbnail.py
            scripts/generate_youtube_metadata.py
            scripts/validate_final_output.py
            scripts/package_output.py
            scripts/pipeline_preflight.py
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required file missing or empty: $file"
              exit 1
            fi
          done

          python -m py_compile "${required_files[@]}"

          python - <<'PY'
          from pathlib import Path
          from scripts.input_config import (
              load_and_validate,
              get_format,
              get_parts_range,
              get_selected_parts,
              get_scenes,
              get_fps,
              get_tts_provider_order,
              get_image_provider_order,
              get_global_billable_permission,
          )

          config = load_and_validate(Path("Input/topic.txt"))
          mode = get_format(config)
          minimum, maximum = get_parts_range(config)
          selected = get_selected_parts(config, required=False)
          scenes = get_scenes(config)
          fps = get_fps(config)
          tts = get_tts_provider_order(config)
          images = get_image_provider_order(config)

          if mode not in {"short", "full"}:
              raise SystemExit(f"Invalid FORMAT: {mode}")

          if minimum < 1 or maximum < minimum:
              raise SystemExit("Invalid PARTS range.")

          if selected is not None and not minimum <= selected <= maximum:
              raise SystemExit(
                  f"Actual PARTS {selected} is outside {minimum}-{maximum}"
              )

          if minimum == maximum and selected not in (None, minimum):
              raise SystemExit("Fixed PARTS selection mismatch.")

          if scenes < 1:
              raise SystemExit("SCENES must be positive.")

          if not 1 <= fps <= 60:
              raise SystemExit(f"Invalid FPS: {fps}")

          if len(tts) < 3 or len(set(tts)) != len(tts):
              raise SystemExit("TTS provider order is invalid.")

          if not images or len(set(images)) != len(images):
              raise SystemExit("Image provider order is invalid.")

          if not get_global_billable_permission(config):
              raise SystemExit(
                  "Input configuration does not allow billable providers."
              )

          print("INPUT CONFIGURATION VALID")
          print("FORMAT:", mode)
          print("PARTS RANGE:", minimum, "-", maximum)
          print("ACTUAL PARTS:", selected if selected is not None else "selected after corrected story")
          print("SCENES PER PART:", scenes)
          print("FPS:", fps)
          print("TTS FALLBACK ORDER:", " -> ".join(tts))
          print("IMAGE FALLBACK ORDER:", " -> ".join(images))
          print("BILLABLE PROVIDERS ALLOWED: true")
          PY

      - name: Calculate input and pipeline fingerprints
        id: fingerprints
        shell: bash
        run: |
          set -euo pipefail

          INPUT_HASH="$(sha256sum Input/topic.txt | awk '{print $1}')"

          {
            sha256sum .github/workflows/generate-photo-motion-video.yml
            sha256sum requirements.txt
            find scripts -type f -name '*.py' -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
          } > /tmp/katha-photo-motion-pipeline.sha256

          PIPELINE_HASH="$(
            sha256sum /tmp/katha-photo-motion-pipeline.sha256 \
              | awk '{print $1}'
          )"

          {
            echo "input_hash=$INPUT_HASH"
            echo "pipeline_hash=$PIPELINE_HASH"
          } >> "$GITHUB_OUTPUT"

          echo "Input fingerprint: $INPUT_HASH"
          echo "Pipeline fingerprint: $PIPELINE_HASH"

      - name: Restore matching resumable checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_INPUT_HASH: ${{ steps.fingerprints.outputs.input_hash }}
          CURRENT_PIPELINE_HASH: ${{ steps.fingerprints.outputs.pipeline_hash }}
        run: |
          set -euo pipefail

          mkdir -p output
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          RUN_IDS="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow generate-photo-motion-video.yml \
              --branch "$GITHUB_REF_NAME" \
              --limit 30 \
              --json databaseId,status,conclusion \
              --jq '
                .[]
                | select(.status == "completed")
                | select(.conclusion == "success")
                | .databaseId
              ' 2>/dev/null || true
          )"

          for RUN_ID in $RUN_IDS; do
            DEST="$TEMP_DIR/$RUN_ID"
            mkdir -p "$DEST"

            if ! gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "katha-photo-motion-checkpoint-$RUN_ID" \
              --dir "$DEST" 2>/dev/null; then
              continue
            fi

            CHECKPOINT="$DEST/checkpoint.zip"
            [ -s "$CHECKPOINT" ] || continue

            if ! unzip -tq "$CHECKPOINT" >/dev/null 2>&1; then
              echo "Skipping corrupt checkpoint: $RUN_ID"
              continue
            fi

            if ! python - "$CHECKPOINT" "$DEST/extracted" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if not infos:
                  raise SystemExit("Empty checkpoint ZIP.")

              total_size = 0
              seen = set()

              for info in infos:
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if (
                      path.is_absolute()
                      or not path.parts
                      or any(part in {"", ".", ".."} for part in path.parts)
                      or ":" in path.parts[0]
                  ):
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  if name in seen:
                      raise SystemExit(f"Duplicate ZIP path: {name}")
                  seen.add(name)

                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink in checkpoint: {name}")

                  total_size += info.file_size
                  if total_size > 8 * 1024 * 1024 * 1024:
                      raise SystemExit("Checkpoint exceeds 8 GiB.")

              destination.mkdir(parents=True, exist_ok=True)
              zf.extractall(destination)
          PY
            then
              echo "Skipping unsafe checkpoint: $RUN_ID"
              continue
            fi

            SAVED_OUTPUT="$DEST/extracted/output"
            [ -d "$SAVED_OUTPUT" ] || continue

            INPUT_FILE="$SAVED_OUTPUT/.resume-input.sha256"
            PIPELINE_FILE="$SAVED_OUTPUT/.resume-pipeline.sha256"
            CONTEXT_FILE="$SAVED_OUTPUT/.resume-context.json"

            [ -s "$INPUT_FILE" ] || continue
            [ -s "$PIPELINE_FILE" ] || continue
            [ -s "$CONTEXT_FILE" ] || continue

            SAVED_INPUT_HASH="$(tr -d '\r\n' < "$INPUT_FILE")"
            SAVED_PIPELINE_HASH="$(tr -d '\r\n' < "$PIPELINE_FILE")"

            [ "$SAVED_INPUT_HASH" = "$CURRENT_INPUT_HASH" ] || continue
            [ "$SAVED_PIPELINE_HASH" = "$CURRENT_PIPELINE_HASH" ] || continue

            if ! python - "$CONTEXT_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts.input_config import (
              load_and_validate,
              get_format,
              get_parts_range,
          )

          context = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          config = load_and_validate("Input/topic.txt")
          mode = get_format(config)
          minimum, maximum = get_parts_range(config)

          if context.get("format") != mode:
              raise SystemExit("Checkpoint FORMAT mismatch.")

          if context.get("parts_min") != minimum:
              raise SystemExit("Checkpoint PARTS minimum mismatch.")

          if context.get("parts_max") != maximum:
              raise SystemExit("Checkpoint PARTS maximum mismatch.")

          selected = context.get("actual_parts")
          if not isinstance(selected, int) or not minimum <= selected <= maximum:
              raise SystemExit("Checkpoint actual PARTS is invalid.")

          if not isinstance(context.get("naming_key"), str) or not context["naming_key"]:
              raise SystemExit("Checkpoint naming key is missing.")

          print("Checkpoint FORMAT, PARTS and naming context verified.")
          PY
            then
              echo "Checkpoint context mismatch: $RUN_ID"
              continue
            fi

            if [ -z "$(
              find "$SAVED_OUTPUT" -type f \
                ! -name '.resume-*' -print -quit
            )" ]; then
              continue
            fi

            cp -a "$SAVED_OUTPUT/." output/
            echo "Matching checkpoint restored from run $RUN_ID."
            break
          done

          echo "Checkpoint restore scan completed."

      - name: Install FFmpeg and Hindi font tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg zip unzip fontconfig \
            fonts-noto-core fonts-noto-extra

          ffmpeg -version
          ffprobe -version
          fc-cache -f

          fc-match "Noto Sans Devanagari"
          fc-match "Mukta"
          fc-match "Hind"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

          python - <<'PY'
          import cv2
          import edge_tts
          import gradio_client
          import huggingface_hub
          import numpy
          import PIL
          import requests
          import torch
          import transformers

          print("Python dependencies imported successfully.")
          print("OpenCV:", cv2.__version__)
          print("NumPy:", numpy.__version__)
          print("Pillow:", PIL.__version__)
          print("PyTorch:", torch.__version__)
          print("Transformers:", transformers.__version__)
          PY

      - name: Install Hindi caption fonts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install_caption_fonts.py
          fc-cache -f
          fc-match "Noto Sans Devanagari"
          fc-match "Mukta"
          fc-match "Hind"
          fc-match "Tiro Devanagari Hindi"

      - name: Run strict Photo Motion preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pipeline_preflight.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/preflight_report.json")
          if not path.is_file():
              raise SystemExit("Preflight report was not created.")

          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("ready_to_run") is not True:
              for item in report.get("failures", []):
                  print("PREFLIGHT FAILURE:", item)
              raise SystemExit("Preflight did not approve generation.")

          if report.get("api_calls_made") != 0:
              raise SystemExit("Preflight must not make API calls.")

          print("Preflight report verified.")
          print("Checks passed:", report.get("checks_passed"))
          PY

      - name: Generate caption font preview
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preview_caption_fonts.py
          test -s output/captions/caption_font_preview.png
          test -s output/captions/caption_font_preview.json

      - name: Select configured Gemini model
        run: python scripts/select_gemini_model.py

      - name: Generate complete story plan
        run: python scripts/generate_story_plan.py

      - name: Generate story
        run: python scripts/generate_story.py

      - name: Verify actual PARTS selection
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from scripts.input_config import (
              load_and_validate,
              get_format,
              get_parts_range,
              get_parts,
              get_selected_parts_record,
          )

          config = load_and_validate("Input/topic.txt")
          mode = get_format(config)
          minimum, maximum = get_parts_range(config)
          actual = get_parts(config)
          record = get_selected_parts_record(config)

          if not minimum <= actual <= maximum:
              raise SystemExit("Actual PARTS is outside the configured range.")

          if record is None or record.get("selected_parts") != actual:
              raise SystemExit("Actual PARTS selection record is missing or inconsistent.")

          if record.get("format") != mode:
              raise SystemExit("PARTS selection FORMAT mismatch.")

          print("FORMAT:", mode)
          print("ACTUAL PARTS:", actual)
          print("PARTS RANGE:", minimum, "-", maximum)
          PY

      - name: Validate exact story length and structure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_story_length.py

          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("output/story/story_length_validation.json")
          if not report_path.is_file():
              raise SystemExit("Story length validation report is missing.")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report.get("summary")

          if not isinstance(summary, dict):
              raise SystemExit("Story length summary is missing.")

          if summary.get("valid") is not True:
              for error in summary.get("structure_errors", []):
                  print("STORY STRUCTURE ERROR:", error)
              raise SystemExit("Story length validation failed.")

          expected_parts = summary.get("parts_expected")
          found_parts = summary.get("parts_found")
          expected_scenes = summary.get("scenes_expected")
          found_scenes = summary.get("scenes_found")

          if expected_parts != found_parts:
              raise SystemExit(
                  f"PARTS mismatch: expected={expected_parts}, found={found_parts}"
              )

          if expected_scenes != found_scenes:
              raise SystemExit(
                  f"SCENES mismatch: expected={expected_scenes}, found={found_scenes}"
              )

          print("STORY LENGTH VALIDATION PASSED")
          print("Actual PARTS:", found_parts)
          print("Scenes:", found_scenes)
          print("Words:", summary.get("total_words"))
          PY

      - name: Verify story preservation and consistency
        run: python scripts/verify_story.py

      - name: Generate AI story artifacts
        run: python scripts/generate_ai_story.py

      - name: Generate character bible
        run: python scripts/generate_character_bible.py

      - name: Generate scenes with story roles
        run: python scripts/generate_scenes.py

      - name: Prepare narration jobs
        run: python scripts/generate_narration.py

      - name: Prepare caption source
        run: python scripts/prepare_captions.py

      - name: Generate narration audio
        run: python scripts/generate_tts.py

      - name: Generate background music
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_flow_music.py

          if [ -s output/music/flow_music_manifest.json ]; then
            echo "Background music manifest created."
          else
            echo "::warning::Music provider did not create a manifest."
            echo "Sound design will apply its configured fallback."
          fi

      - name: Prepare visual generation jobs
        run: python scripts/generate_visuals.py

      - name: Generate scene images
        run: python scripts/free_image_generator.py

      - name: Validate images and prepare Photo Motion jobs
        run: python scripts/prepare_visuals.py

      - name: Generate depth maps
        run: python scripts/generate_depth_maps.py

      - name: Render Photo Motion scene clips
        run: python scripts/photo_motion.py

      - name: Generate music, ambience and sound effects
        run: python scripts/generate_sound_design.py

      - name: Validate sound effect timing
        run: python scripts/validate_sfx_timing.py

      - name: Render scene audio and video parts
        run: python scripts/render_video.py

      - name: Burn captions into final video
        run: python scripts/burn_captions.py

      - name: Generate story-specific thumbnail
        run: python scripts/generate_thumbnail.py

      - name: Generate YouTube metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_youtube_metadata.py

          test -s output/youtube_metadata.txt
          test -s output/publish/youtube_metadata.json

          echo "YouTube metadata files verified."

      - name: Validate final video and deliverables
        run: python scripts/validate_final_output.py

      - name: Package story-specific output
        id: package
        shell: bash
        run: |
          set -euo pipefail

          python scripts/package_output.py

          python - <<'PY'
          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          manifest_path = Path("output/package_manifest.json")
          if not manifest_path.is_file():
              raise SystemExit("Package manifest is missing.")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "completed":
              raise SystemExit("Package status is not completed.")

          mode = manifest.get("format")
          if mode not in {"short", "full"}:
              raise SystemExit("Package FORMAT is invalid.")

          archive_name = str(manifest.get("archive", "")).strip()
          if not archive_name:
              raise SystemExit("Package archive name is missing.")

          archive = Path(archive_name)
          if archive.is_absolute() or ".." in archive.parts:
              raise SystemExit("Unsafe package archive path.")

          if not re.fullmatch(
              r"katha-lok-[\w-]+-" + re.escape(mode) + r"-output\.zip",
              archive.name,
              flags=re.UNICODE,
          ):
              raise SystemExit(
                  "ZIP filename must contain the story title and selected FORMAT."
              )

          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("Story ZIP is missing or empty.")

          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          actual_hash = digest.hexdigest()
          if manifest.get("archive_sha256") != actual_hash:
              raise SystemExit("Archive SHA256 mismatch.")

          if manifest.get("archive_bytes") != archive.stat().st_size:
              raise SystemExit("Archive byte count mismatch.")

          if manifest.get("zip_integrity") != "valid":
              raise SystemExit("ZIP integrity is not valid.")

          if manifest.get("manifest_zip_consistency") != "valid":
              raise SystemExit("ZIP and manifest consistency failed.")

          if manifest.get("part_videos_only") is not True:
              raise SystemExit("Package must contain Part videos only.")

          if manifest.get("combined_video_included") is not False:
              raise SystemExit("Combined video is forbidden.")

          if manifest.get("format_alias_included") is not False:
              raise SystemExit("Format-alias video is forbidden.")

          if manifest.get("parts") != manifest.get("configured_parts"):
              raise SystemExit("Package actual PARTS mismatch.")

          expected_parts = int(manifest["parts"])
          if expected_parts < 1:
              raise SystemExit("Package PARTS must be positive.")

          with zipfile.ZipFile(archive, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")

              names = zf.namelist()
              if not names:
                  raise SystemExit("ZIP is empty.")

              if len(names) != len(set(names)):
                  raise SystemExit("Duplicate ZIP members found.")

              videos = [
                  name for name in names
                  if name.lower().endswith((".mp4", ".mov", ".mkv", ".webm"))
              ]

              expected_videos = {
                  f"output/parts/part_{number:02d}.mp4"
                  for number in range(1, expected_parts + 1)
              }

              if set(videos) != expected_videos:
                  raise SystemExit(
                      "ZIP must contain exactly the expected story Part videos; "
                      f"found={sorted(videos)}"
                  )

              forbidden_names = {
                  "output/katha_lok_ai_final.mp4",
                  "output/katha_lok_ai_short.mp4",
                  "output/katha_lok_ai_full.mp4",
              }

              if forbidden_names.intersection(names):
                  raise SystemExit("Generic or combined video found in ZIP.")

          Path("output/package_archive_name.txt").write_text(
              archive.name + "\n",
              encoding="utf-8",
          )

          print("FORMAT:", mode)
          print("ACTUAL PARTS:", expected_parts)
          print("STORY ZIP:", archive.name)
          print("ZIP SHA256:", actual_hash)
          print("ZIP integrity: valid")
          PY

          ARCHIVE="$(cat output/package_archive_name.txt)"
          test -s "$ARCHIVE"

          {
            echo "archive=$ARCHIVE"
          } >> "$GITHUB_OUTPUT"

          ls -lh "$ARCHIVE"

      - name: Verify final package and archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(cat output/package_archive_name.txt)"
          test -s "$ARCHIVE"

          python - "$ARCHIVE" <<'PY'
          import hashlib
          import json
          import re
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          manifest_path = Path("output/package_manifest.json")

          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("Final story ZIP is missing or empty.")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "completed":
              raise SystemExit("Package status is not completed.")

          mode = manifest.get("format")
          if mode not in {"short", "full"}:
              raise SystemExit("Invalid package FORMAT.")

          if archive.name != manifest.get("archive"):
              raise SystemExit("ZIP filename and manifest disagree.")

          if not re.fullmatch(
              r"katha-lok-[\w-]+-" + re.escape(mode) + r"-output\.zip",
              archive.name,
              flags=re.UNICODE,
          ):
              raise SystemExit("ZIP name does not match story and FORMAT.")

          if manifest.get("parts") != manifest.get("configured_parts"):
              raise SystemExit("Actual PARTS mismatch in package manifest.")

          if manifest.get("zip_integrity") != "valid":
              raise SystemExit("ZIP integrity is not valid.")

          if manifest.get("manifest_zip_consistency") != "valid":
              raise SystemExit("ZIP/manifest consistency failed.")

          if manifest.get("part_videos_only") is not True:
              raise SystemExit("Package is not Part-video-only.")

          if manifest.get("combined_video_included") is not False:
              raise SystemExit("Combined video is forbidden.")

          if manifest.get("format_alias_included") is not False:
              raise SystemExit("Format alias is forbidden.")

          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          actual_hash = digest.hexdigest()
          if actual_hash != manifest.get("archive_sha256"):
              raise SystemExit("Final ZIP SHA256 mismatch.")

          if archive.stat().st_size != manifest.get("archive_bytes"):
              raise SystemExit("Final ZIP byte count mismatch.")

          with zipfile.ZipFile(archive, "r") as zf:
              bad_member = zf.testzip()
              if bad_member:
                  raise SystemExit(f"Corrupt ZIP member: {bad_member}")

              names = zf.namelist()
              if not names or len(names) != len(set(names)):
                  raise SystemExit("ZIP is empty or contains duplicate members.")

              videos = [
                  name for name in names
                  if name.lower().endswith((".mp4", ".mov", ".mkv", ".webm"))
              ]

              expected = {
                  f"output/parts/part_{number:02d}.mp4"
                  for number in range(1, int(manifest["parts"]) + 1)
              }

              if set(videos) != expected:
                  raise SystemExit("ZIP contains missing or extra Part videos.")

              if any(
                  name in names
                  for name in (
                      "output/katha_lok_ai_final.mp4",
                      "output/katha_lok_ai_short.mp4",
                      "output/katha_lok_ai_full.mp4",
                  )
              ):
                  raise SystemExit("Generic or combined video is forbidden.")

          print("Final ZIP integrity: valid")
          print("Final ZIP SHA256:", actual_hash)
          print("FORMAT:", mode)
          print("ACTUAL PARTS:", manifest["parts"])
          print("STORY ZIP:", archive.name)
          PY

      - name: Upload final story-named ZIP only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-${{ github.run_id }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save resumable checkpoint
        if: always() && steps.fingerprints.outputs.input_hash != ''
        shell: bash
        env:
          INPUT_HASH: ${{ steps.fingerprints.outputs.input_hash }}
          PIPELINE_HASH: ${{ steps.fingerprints.outputs.pipeline_hash }}
        run: |
          set -euo pipefail

          mkdir -p output

          python - <<'PY'
          import json
          import os
          import re
          import tempfile
          from pathlib import Path

          from scripts.input_config import (
              load_and_validate,
              get_format,
              get_parts_range,
              get_parts,
          )

          config = load_and_validate("Input/topic.txt")
          mode = get_format(config)
          minimum, maximum = get_parts_range(config)
          actual = get_parts(config)

          if not minimum <= actual <= maximum:
              raise SystemExit("Cannot checkpoint invalid actual PARTS.")

          title = str(config.get("TITLE") or config.get("TOPIC") or "").strip()
          story_path = Path("output/story/story.json")

          if story_path.is_file():
              try:
                  story = json.loads(story_path.read_text(encoding="utf-8"))
                  if isinstance(story, dict):
                      title = str(
                          story.get("title")
                          or story.get("story_title")
                          or title
                      ).strip()
              except (OSError, ValueError):
                  pass

          slug = re.sub(r"[^\w-]+", "-", title.lower(), flags=re.UNICODE)
          slug = re.sub(r"-+", "-", slug).strip("-")[:100]
          if not slug:
              raise SystemExit("Cannot checkpoint without a story naming key.")

          context = {
              "schema_version": 1,
              "format": mode,
              "parts_min": minimum,
              "parts_max": maximum,
              "actual_parts": actual,
              "naming_key": slug,
          }

          destination = Path("output/.resume-context.json")
          destination.parent.mkdir(parents=True, exist_ok=True)

          fd, temporary_name = tempfile.mkstemp(
              prefix=".resume-context-",
              suffix=".tmp",
              dir=str(destination.parent),
          )

          try:
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  json.dump(context, handle, ensure_ascii=False, indent=2)
                  handle.write("\n")
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temporary_name, destination)
          except Exception:
              Path(temporary_name).unlink(missing_ok=True)
              raise
          PY

          printf '%s\n' "$INPUT_HASH" > output/.resume-input.sha256
          printf '%s\n' "$PIPELINE_HASH" > output/.resume-pipeline.sha256

          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path

          root = Path("output")
          archive = Path("checkpoint.zip")
          temporary = Path("checkpoint.zip.tmp")
          temporary.unlink(missing_ok=True)

          if not root.is_dir():
              raise SystemExit("Output directory is unavailable.")

          files = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"Refusing checkpoint symlink: {path}")
              if path.is_file():
                  files.append(path)

          if not files:
              raise SystemExit("No output files available for checkpoint.")

          with zipfile.ZipFile(
              temporary,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=3,
              allowZip64=True,
          ) as zf:
              for path in files:
                  relative = path.as_posix()
                  if relative.startswith("/") or ".." in Path(relative).parts:
                      raise SystemExit(f"Unsafe checkpoint path: {relative}")

                  info = zipfile.ZipInfo(relative)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o600) << 16

                  with path.open("rb") as source:
                      with zf.open(info, "w") as destination:
                          while True:
                              chunk = source.read(1024 * 1024)
                              if not chunk:
                                  break
                              destination.write(chunk)

          with zipfile.ZipFile(temporary, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Checkpoint ZIP verification failed: {bad}")

          os.replace(temporary, archive)

          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("Checkpoint ZIP was not created.")

          print("Checkpoint saved:", archive.stat().st_size, "bytes")
          print("Checkpoint files:", len(files))
          PY

      - name: Upload resumable checkpoint
        if: always() && steps.fingerprints.outputs.input_hash != ''
        uses: actions/upload-artifact@v4
        with:
          name: katha-photo-motion-checkpoint-${{ github.run_id }}
          path: checkpoint.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7