      - name: Validate final video and deliverables
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from scripts.input_config import (
              load_and_validate,
              get_format,
          )

          root = Path.cwd().resolve()
          output = (root / "output").resolve()
          render_manifest = (
              output / "scene_renders" / "render_manifest.json"
          )
          video_dir = output / "videos"

          if not render_manifest.is_file():
              raise SystemExit("Render manifest is missing.")

          config = load_and_validate(root / "Input" / "topic.txt")
          mode = str(get_format(config)).strip().lower()

          if mode not in {"short", "full"}:
              raise SystemExit(f"Invalid FORMAT: {mode}")

          data = json.loads(
              render_manifest.read_text(encoding="utf-8-sig")
          )

          if not isinstance(data, dict):
              raise SystemExit("Render manifest must be a JSON object.")

          if data.get("status") != "completed":
              raise SystemExit("Render manifest is not completed.")

          if str(data.get("format", "")).lower() != mode:
              raise SystemExit("Render manifest FORMAT mismatch.")

          def checked_output_file(value, label):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"{label}: path missing.")

              candidate = Path(value.strip())
              if not candidate.is_absolute():
                  candidate = root / candidate

              resolved = candidate.resolve()

              if not resolved.is_relative_to(output):
                  raise SystemExit(f"{label}: path escapes output/.")

              if not resolved.is_file():
                  raise SystemExit(f"{label}: file missing: {resolved}")

              if resolved.stat().st_size < 1000:
                  raise SystemExit(f"{label}: file is too small.")

              return resolved

          source = checked_output_file(
              data.get("final_video"),
              "Final captioned video",
          )

          expected_name = (
              "katha_lok_ai_short.mp4"
              if mode == "short"
              else "katha_lok_ai_full.mp4"
          )

          alias = checked_output_file(
              data.get("alias"),
              "Format-specific video alias",
          ) if data.get("alias") else None

          expected_alias = (video_dir / expected_name).resolve()

          if alias is not None and alias != expected_alias:
              raise SystemExit(
                  "Render manifest points to the wrong format alias: "
                  f"{alias}"
              )

          video_dir.mkdir(parents=True, exist_ok=True)

          if source == expected_alias:
              raise SystemExit(
                  "Final video and format alias must be separate files."
              )

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(
                      lambda: handle.read(1024 * 1024),
                      b"",
                  ):
                      value.update(chunk)
              return value.hexdigest()

          source_hash = digest(source)

          if (
              not expected_alias.is_file()
              or digest(expected_alias) != source_hash
          ):
              fd, temporary_name = tempfile.mkstemp(
                  prefix=".format-video-",
                  suffix=".mp4",
                  dir=video_dir,
              )
              os.close(fd)
              temporary = Path(temporary_name)

              try:
                  shutil.copy2(source, temporary)

                  if digest(temporary) != source_hash:
                      raise SystemExit(
                          "Copied format video SHA256 mismatch."
                      )

                  os.replace(temporary, expected_alias)
              finally:
                  temporary.unlink(missing_ok=True)

          if digest(expected_alias) != source_hash:
              raise SystemExit(
                  "Format-specific video does not match final video."
              )

          opposite_name = (
              "katha_lok_ai_full.mp4"
              if mode == "short"
              else "katha_lok_ai_short.mp4"
          )

          opposite_candidates = (
              video_dir / opposite_name,
              output / opposite_name,
          )

          for candidate in opposite_candidates:
              if not candidate.exists() and not candidate.is_symlink():
                  continue

              if candidate.is_symlink() or not candidate.is_file():
                  raise SystemExit(
                      f"Unsafe opposite-format output: {candidate}"
                  )

              candidate.unlink()
              print("Removed opposite-format output:", candidate)

          print("FORMAT:", mode)
          print("FINAL VIDEO:", source)
          print("FORMAT ALIAS:", expected_alias)
          print("SHA256:", source_hash)
          print("FORMAT VIDEO SYNCHRONIZATION: valid")
          PY

          python scripts/validate_final_output.py

          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("output/validation_report.json")

          if not report_path.is_file():
              raise SystemExit("Final validation report is missing.")

          report = json.loads(
              report_path.read_text(encoding="utf-8")
          )

          if report.get("status") != "completed":
              raise SystemExit("Final validation did not complete.")

          checks = report.get("checks")
          if not isinstance(checks, dict):
              raise SystemExit("Final validation checks are missing.")

          required = (
              "photo_motion",
              "narration",
              "sound_design",
              "render",
              "captions",
              "thumbnail",
              "metadata",
          )

          for name in required:
              result = checks.get(name)
              if not isinstance(result, dict):
                  raise SystemExit(
                      f"Validation result missing: {name}"
                  )
              if result.get("status") != "valid":
                  raise SystemExit(
                      f"Validation failed: {name}"
                  )

          mode = report.get("format")
          if mode not in {"short", "full"}:
              raise SystemExit("Validation report FORMAT is invalid.")

          render = checks["render"]
          final_video = Path(render["final_video"])
          alias = Path(render["alias"])

          if not final_video.is_file() or not alias.is_file():
              raise SystemExit(
                  "Validated final video or format alias is missing."
              )

          if final_video.stat().st_size < 1000:
              raise SystemExit("Final video is too small.")

          if alias.stat().st_size != final_video.stat().st_size:
              raise SystemExit(
                  "Final video and format alias sizes differ."
              )

          expected_alias = (
              "katha_lok_ai_short.mp4"
              if mode == "short"
              else "katha_lok_ai_full.mp4"
          )

          if alias.name != expected_alias:
              raise SystemExit(
                  "Validated format alias name is incorrect."
              )

          print("FINAL VALIDATION: PASSED")
          print("FORMAT:", mode)
          print("PARTS:", report.get("parts"))
          print("SCENES:", report.get("expected_scenes"))
          print("FINAL VIDEO:", final_video)
          print("FORMAT ALIAS:", alias)
          PY