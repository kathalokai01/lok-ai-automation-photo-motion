name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      ALLOW_BILLABLE_PROVIDERS: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and subtitle fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip fonts-noto-core fonts-noto-extra
          fc-cache -f
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pillow edge-tts gradio_client huggingface_hub

      - name: Check input
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "Input/topic.txt" ]; then
            echo "ERROR: Input/topic.txt is missing or empty."
            exit 1
          fi

          echo "Input configuration:"
          cat "Input/topic.txt"

      - name: Verify required scripts
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            scripts/select_gemini_model.py \
            scripts/test_gemini.py \
            scripts/generate_story_plan.py \
            scripts/generate_story.py \
            scripts/generate_ai_story.py \
            scripts/generate_character_bible.py \
            scripts/generate_scenes.py \
            scripts/generate_narration.py \
            scripts/prepare_captions.py \
            scripts/generate_tts.py \
            scripts/generate_visuals.py \
            scripts/free_image_generator.py \
            scripts/photo_motion.py \
            scripts/render_video.py \
            scripts/burn_captions.py \
            scripts/generate_thumbnail.py \
            scripts/validate_final_output.py
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: Required script missing or empty: $file"
              exit 1
            fi
          done

          echo "All required scripts are present."

      - name: Select Gemini model
        run: python scripts/select_gemini_model.py

      - name: Test selected Gemini model
        run: python scripts/test_gemini.py

      - name: Verify selected model file
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/config/selected_model.json")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: Selected Gemini model file is missing."
              )

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              raise SystemExit(
                  f"ERROR: Cannot read selected model file: {exc}"
              )

          if data.get("status") != "selected" or not data.get("model"):
              raise SystemExit(
                  "ERROR: Selected Gemini model is invalid."
              )

          print("Selected Gemini model:", data["model"])
          PY

      - name: Generate story plan
        run: python scripts/generate_story_plan.py

      - name: Generate story
        run: python scripts/generate_story.py

      - name: Generate AI story
        run: python scripts/generate_ai_story.py

      - name: Generate character bible
        run: python scripts/generate_character_bible.py

      - name: Generate scenes
        run: python scripts/generate_scenes.py

      - name: Generate narration jobs
        run: python scripts/generate_narration.py

      - name: Prepare captions in selected language
        run: python scripts/prepare_captions.py

      - name: Generate narration audio
        run: python scripts/generate_tts.py

      - name: Prepare visual jobs
        run: python scripts/generate_visuals.py

      - name: Generate free realistic scene images
        run: python scripts/free_image_generator.py

      - name: Verify generated images
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "output/visuals" ]; then
            echo "ERROR: output/visuals directory is missing."
            exit 1
          fi

          COUNT=$(find output/visuals -type f \
            \( -iname "*.png" -o -iname "*.jpg" \
               -o -iname "*.jpeg" -o -iname "*.webp" \) \
            | wc -l)

          echo "Generated image count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No scene images were generated."
            exit 1
          fi

          find output/visuals -maxdepth 4 -type f -print

      - name: Create Photo Motion scene videos
        run: python scripts/photo_motion.py

      - name: Verify Photo Motion manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="output/photo_motion/photo_motion_manifest.json"

          if [ ! -s "$MANIFEST" ]; then
            echo "ERROR: Photo Motion manifest is missing or empty."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "output/photo_motion/photo_motion_manifest.json"
          )

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              raise SystemExit(
                  f"ERROR: Cannot parse Photo Motion manifest: {exc}"
              )

          if isinstance(data, dict):
              scenes = data.get("scenes", data.get("clips", []))
          elif isinstance(data, list):
              scenes = data
          else:
              scenes = []

          if not scenes:
              raise SystemExit(
                  "ERROR: Photo Motion manifest contains no scenes."
              )

          print("Photo Motion scene entries:", len(scenes))
          PY

      - name: Render final video
        run: python scripts/render_video.py

      - name: Verify rendered video
        shell: bash
        run: |
          set -euo pipefail

          VIDEO="output/videos/katha_lok_ai_final.mp4"

          if [ ! -s "$VIDEO" ]; then
            echo "ERROR: Rendered MP4 is missing or empty: $VIDEO"
            exit 1
          fi

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height \
            -of json "$VIDEO"

      - name: Burn captions into final video
        run: python scripts/burn_captions.py

      - name: Verify captions and captioned video
        shell: bash
        run: |
          set -euo pipefail

          VIDEO="output/videos/katha_lok_ai_final.mp4"
          CAPTIONS="output/captions/captions.json"
          SRT="output/captions/final_captions.srt"

          for file in "$VIDEO" "$CAPTIONS" "$SRT"; do
            if [ ! -s "$file" ]; then
              echo "ERROR: Required output is missing or empty: $file"
              exit 1
            fi
          done

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("output/videos/katha_lok_ai_final.mp4")
          captions = Path("output/captions/captions.json")
          srt = Path("output/captions/final_captions.srt")

          try:
              caption_data = json.loads(
                  captions.read_text(encoding="utf-8")
              )
          except (OSError, ValueError) as exc:
              raise SystemExit(
                  f"ERROR: Captions JSON cannot be parsed: {exc}"
              )

          if not caption_data:
              raise SystemExit("ERROR: Captions JSON is empty.")

          subtitle_text = srt.read_text(encoding="utf-8").strip()
          if not subtitle_text:
              raise SystemExit("ERROR: SRT subtitle file is empty.")

          result = subprocess.run(
              [
                  "ffprobe", "-v", "error",
                  "-show_entries", "stream=codec_type",
                  "-of", "json", str(video)
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          streams = json.loads(result.stdout).get("streams", [])

          if not any(
              stream.get("codec_type") == "video"
              for stream in streams
          ):
              raise SystemExit(
                  "ERROR: Final MP4 has no video stream."
              )

          print("Caption JSON exists and is valid.")
          print("SRT exists and contains subtitle text.")
          print("Captioned MP4 contains a video stream.")
          PY

          ls -lh "$VIDEO"

      - name: Generate thumbnail
        run: python scripts/generate_thumbnail.py

      - name: Verify thumbnail
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "output/thumbnail.jpg" ] && \
             [ ! -s "output/thumbnail.png" ] && \
             [ ! -s "output/videos/thumbnail.jpg" ] && \
             [ ! -s "output/videos/thumbnail.png" ]; then
            echo "WARNING: Thumbnail not found at expected paths."
            find output -maxdepth 4 -type f \
              -iname '*thumbnail*' -print
          else
            echo "Thumbnail file found."
          fi

      - name: Create dynamic YouTube metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          output = Path("output")
          output.mkdir(parents=True, exist_ok=True)

          topic_path = Path("Input/topic.txt")
          topic = (
              topic_path.read_text(encoding="utf-8-sig").strip()
              if topic_path.exists()
              else ""
          )
          topic = re.sub(r"\s+", " ", topic)

          title_file = output / "story" / "final_title.txt"
          story_title = ""

          if title_file.is_file():
              lines = title_file.read_text(
                  encoding="utf-8"
              ).strip().splitlines()

              if lines:
                  story_title = lines[0].strip()

          title = re.sub(
              r"\s+",
              " ",
              story_title or topic or "Katha Lok AI Story",
          ).strip()[:100]

          story_file = output / "story" / "story.json"
          story_text = ""

          if story_file.is_file():
              try:
                  data = json.loads(
                      story_file.read_text(encoding="utf-8")
                  )

                  chunks = []

                  for part in data.get("parts", []):
                      for scene in part.get("scenes", []):
                          narration = scene.get("narration", "")
                          if narration:
                              chunks.append(str(narration).strip())

                  story_text = " ".join(chunks)

              except (OSError, ValueError, TypeError) as exc:
                  print(
                      "WARNING: Could not parse story.json:",
                      exc,
                  )

          story_text = re.sub(r"\s+", " ", story_text).strip()
          description_story = story_text[:2500]

          if len(story_text) > 2500:
              description_story = (
                  description_story.rsplit(" ", 1)[0] + "..."
              )

          if description_story:
              description = (
                  f"{title}\n\n"
                  f"{description_story}\n\n"
                  "Watch the story till the end and share "
                  "your thoughts in the comments."
              )
          else:
              description = (
                  f"{title}\n\n"
                  "Watch this story from Katha Lok AI, based on: "
                  f"{topic or title}.\n\n"
                  "Share your thoughts in the comments."
              )

          words = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+",
              f"{title} {topic} {story_text[:5000]}",
          )

          dynamic_tags = []
          seen = set()

          for word in words:
              word = word.strip()
              key = word.casefold()

              if len(word) >= 3 and key not in seen:
                  seen.add(key)
                  dynamic_tags.append(word)

          fixed_tags = [
              "Katha Lok AI",
              "Hindi story",
              "Hindi kahani",
              "Hindi storytelling",
          ]

          tags = []
          tag_seen = set()

          for tag in dynamic_tags + fixed_tags:
              key = tag.casefold()

              if key not in tag_seen:
                  tag_seen.add(key)
                  tags.append(tag)

          tags = tags[:20]

          title_words = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+",
              title,
          )
          title_hashtag = "".join(title_words[:3])

          hashtags = ["#KathaLokAI", "#HindiKahani"]

          if title_hashtag:
              candidate = "#" + title_hashtag

              if candidate.casefold() not in {
                  item.casefold() for item in hashtags
              }:
                  hashtags.append(candidate)

          description += "\n\n" + " ".join(hashtags)

          metadata = (
              f"Title:\n{title}\n\n"
              f"Description:\n\n{description}\n\n"
              f"Tags:\n{', '.join(tags)}\n"
          )

          path = output / "youtube_metadata.txt"
          path.write_text(metadata, encoding="utf-8")

          print("Created:", path)
          print(metadata)
          PY

      - name: Sync captioned video and validate final output
        shell: bash
        run: |
          set -euo pipefail

          FINAL="output/videos/katha_lok_ai_final.mp4"

          if [ ! -s "$FINAL" ]; then
            echo "ERROR: Final captioned MP4 is missing or empty."
            exit 1
          fi

          FORMAT=$(python - <<'PY'
          from pathlib import Path

          path = Path("Input/topic.txt")
          values = {}

          for line in path.read_text(
              encoding="utf-8-sig"
          ).splitlines():
              line = line.strip()

              if not line or line.startswith("#") or "=" not in line:
                  continue

              key, value = line.split("=", 1)
              values[key.strip().upper()] = (
                  value.split("#", 1)[0].strip().strip("'\"")
              )

          print(values.get("FORMAT", "short").lower())
          PY
          )

          case "$FORMAT" in
            full|long|landscape|youtube)
              ALIAS="output/videos/katha_lok_ai_full.mp4"
              ;;
            *)
              ALIAS="output/videos/katha_lok_ai_short.mp4"
              ;;
          esac

          cp "$FINAL" "$ALIAS"

          echo "Captioned video synced to: $ALIAS"
          test -s "$ALIAS"

          python scripts/validate_final_output.py

          echo "Final output inventory:"
          find output -maxdepth 4 -type f -print

          echo "Final MP4 technical details:"
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height \
            -of json "$FINAL"

      - name: Create final ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd output
          zip -r ../katha-lok-ai-photo-motion-output.zip .
          cd ..

          if [ ! -s "katha-lok-ai-photo-motion-output.zip" ]; then
            echo "ERROR: Final ZIP is missing or empty."
            exit 1
          fi

          ls -lh katha-lok-ai-photo-motion-output.zip

      - name: Upload final output
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-output
          path: |
            output/**
            katha-lok-ai-photo-motion-output.zip
          if-no-files-found: error
          retention-days: 7