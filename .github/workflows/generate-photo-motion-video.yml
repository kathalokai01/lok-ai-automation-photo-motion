

name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      ALLOW_BILLABLE_PROVIDERS: "false"
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip fonts-noto-core fonts-noto-extra
          fc-cache -f
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            requests \
            pillow \
            edge-tts \
            gradio_client \
            huggingface_hub \
            opencv-python-headless

      - name: Install CPU depth estimation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers
          python - <<'PY'
          import torch
          import transformers
          import cv2
          from PIL import Image
          print("PyTorch:", torch.__version__)
          print("Transformers:", transformers.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", Image.__module__)
          PY

      - name: Check input and required scripts
        shell: bash
        run: |
          set -euo pipefail
          test -s Input/topic.txt || {
            echo "ERROR: Input/topic.txt is missing or empty."
            exit 1
          }
          cat Input/topic.txt

          for file in \
            scripts/select_gemini_model.py \
            scripts/test_gemini.py \
            scripts/generate_story_plan.py \
            scripts/generate_story.py \
            scripts/generate_ai_story.py \
            scripts/generate_character_bible.py \
            scripts/generate_scenes.py \
            scripts/generate_narration.py \
            scripts/prepare_captions.py \
            scripts/generate_tts.py \
            scripts/generate_visuals.py \
            scripts/free_image_generator.py \
            scripts/generate_depth_maps.py \
            scripts/depth_parallax.py \
            scripts/photo_motion.py \
            scripts/render_video.py \
            scripts/burn_captions.py \
            scripts/generate_thumbnail.py \
            scripts/validate_final_output.py
          do
            test -s "$file" || {
              echo "ERROR: Missing script: $file"
              exit 1
            }
          done
          echo "Input and required scripts found."

      - name: Select an available Gemini model
        run: python scripts/select_gemini_model.py

      - name: Test selected Gemini model
        run: python scripts/test_gemini.py

      - name: Verify Gemini model selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/config/selected_model.json")
          if not path.is_file():
              raise SystemExit("Selected model file is missing.")

          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("status") != "selected" or not data.get("model"):
              raise SystemExit("Selected model file is invalid.")

          print("Selected model:", data["model"])
          PY

      - name: Generate story plan
        run: python scripts/generate_story_plan.py

      - name: Generate story
        run: python scripts/generate_story.py

      - name: Generate AI story
        run: python scripts/generate_ai_story.py

      - name: Generate character bible
        run: python scripts/generate_character_bible.py

      - name: Generate scenes
        run: python scripts/generate_scenes.py

      - name: Prepare narration jobs
        run: python scripts/generate_narration.py

      - name: Prepare captions
        run: python scripts/prepare_captions.py

      - name: Generate narration audio
        run: python scripts/generate_tts.py

      - name: Prepare visual jobs
        run: python scripts/generate_visuals.py

      - name: Generate scene images using free-only provider chain
        run: python scripts/free_image_generator.py

      - name: Verify scene images and image manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          jobs_path = Path("output/visuals/visual_jobs.json")
          manifest_path = Path("output/visuals/image_manifest.json")

          jobs_data = json.loads(jobs_path.read_text(encoding="utf-8"))
          jobs = jobs_data.get("jobs", []) if isinstance(jobs_data, dict) else jobs_data
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          rows = manifest.get("scenes", []) if isinstance(manifest, dict) else []

          if not jobs or len(rows) != len(jobs):
              raise SystemExit("Image manifest does not match visual jobs.")

          for index, job in enumerate(jobs, 1):
              raw = job.get("image_path") or job.get("image")
              if not raw:
                  raise SystemExit(f"Scene {index} has no image path.")
              path = Path(raw)
              if not path.is_absolute():
                  path = Path.cwd() / path
              if not path.is_file() or path.stat().st_size < 1000:
                  raise SystemExit(f"Scene image missing or too small: {path}")
              try:
                  with Image.open(path) as im:
                      im.verify()
              except Exception as exc:
                  raise SystemExit(f"Invalid image {path}: {exc}")

          print("Verified scene images:", len(jobs))
          PY

      - name: Generate depth maps for 2.5D motion
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_depth_maps.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/visuals/depth_maps/depth_manifest.json")
          if not path.is_file():
              raise SystemExit("Depth manifest is missing.")

          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data if isinstance(data, list) else data.get("scenes", [])
          if not rows:
              raise SystemExit("Depth manifest has no entries.")

          valid = 0
          for row in rows:
              if not isinstance(row, dict):
                  continue
              raw = row.get("depth_map") or row.get("path") or row.get("file")
              if not raw:
                  continue
              p = Path(raw)
              if not p.is_absolute():
                  p = Path.cwd() / p
              if p.is_file() and p.stat().st_size > 100:
                  valid += 1

          if valid == 0:
              raise SystemExit("No valid depth maps were produced.")
          print(f"Valid depth maps: {valid}/{len(rows)}")
          PY

      - name: Render photo-motion scene clips
        run: python scripts/photo_motion.py

      - name: Verify photo-motion manifest and clips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = Path("output/photo_motion/photo_motion_manifest.json")
          if not manifest.is_file():
              raise SystemExit("Photo Motion manifest is missing.")

          rows = json.loads(manifest.read_text(encoding="utf-8"))
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Photo Motion manifest must be a non-empty list.")

          checked = 0
          parallax_count = 0
          depth_backed_count = 0

          for row in rows:
              if not isinstance(row, dict):
                  raise SystemExit("Invalid scene record in motion manifest.")

              raw_video = row.get("video")
              if not raw_video:
                  raise SystemExit("Motion manifest entry has no video field.")

              video = Path(raw_video)
              if not video.is_absolute():
                  video = Path.cwd() / video

              if not video.is_file() or video.stat().st_size < 1000:
                  raise SystemExit(f"Scene clip missing or too small: {video}")

              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "stream=codec_type",
                      "-of", "json", str(video)
                  ],
                  capture_output=True, text=True, check=True
              )
              streams = json.loads(probe.stdout).get("streams", [])
              if not any(s.get("codec_type") == "video" for s in streams):
                  raise SystemExit(f"No video stream in {video}")

              effect = str(row.get("effect", "")).strip().lower()
              depth = row.get("depth_map")
              if effect == "parallax":
                  parallax_count += 1
                  if depth:
                      p = Path(depth)
                      if not p.is_absolute():
                          p = Path.cwd() / p
                      if p.is_file() and p.stat().st_size > 100:
                          depth_backed_count += 1

              checked += 1

          if checked != len(rows):
              raise SystemExit("Not all motion clips passed verification.")

          print("Verified motion clips:", checked)
          print("Parallax-effect scenes:", parallax_count)
          print("Parallax scenes with an existing depth map:", depth_backed_count)
          PY

      - name: Render final video and parts
        run: python scripts/render_video.py

      - name: Verify rendered video
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="output/videos/katha_lok_ai_final.mp4"
          test -s "$VIDEO" || {
            echo "ERROR: Final MP4 is missing."
            exit 1
          }
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height \
            -of json "$VIDEO"

      - name: Burn captions into video
        run: python scripts/burn_captions.py

      - name: Verify captions and captioned video
        shell: bash
        run: |
          set -euo pipefail
          test -s output/videos/katha_lok_ai_final.mp4
          test -s output/captions/captions.json
          test -s output/captions/final_captions.srt

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("output/captions/captions.json").read_text(encoding="utf-8")
          )
          if data.get("status") != "completed":
              raise SystemExit("Captions are not marked completed.")
          captions = data.get("captions", [])
          if not captions or any(not str(x.get("text", "")).strip() for x in captions):
              raise SystemExit("Captions are missing or contain empty text.")

          srt = Path("output/captions/final_captions.srt").read_text(
              encoding="utf-8-sig"
          ).strip()
          if "-->" not in srt:
              raise SystemExit("SRT has no valid timing intervals.")

          print("Validated caption records:", len(captions))
          PY

      - name: Generate thumbnails
        run: python scripts/generate_thumbnail.py

      - name: Verify thumbnails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          candidates = [
              Path("output/thumbnail.jpg"),
              Path("output/thumbnail.png"),
              Path("output/videos/thumbnail.jpg"),
              Path("output/videos/thumbnail.png"),
              Path("output/thumbnail_16_9.jpg"),
              Path("output/thumbnail_vertical.jpg"),
          ]
          found = []
          for path in candidates:
              if path.is_file() and path.stat().st_size > 1000:
                  with Image.open(path) as image:
                      image.verify()
                  found.append(str(path))

          manifest = Path("output/thumbnail_manifest.json")
          if not found and manifest.is_file():
              print(manifest.read_text(encoding="utf-8"))
          if not found:
              print("WARNING: Thumbnail files were not found at common paths.")
          else:
              print("Thumbnail files:", found)
          PY

      - name: Create dynamic YouTube metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          output = Path("output")
          output.mkdir(parents=True, exist_ok=True)

          topic_path = Path("Input/topic.txt")
          topic = topic_path.read_text(
              encoding="utf-8-sig"
          ).strip() if topic_path.is_file() else ""
          topic = re.sub(r"\s+", " ", topic)

          title_path = output / "story" / "final_title.txt"
          title = ""
          if title_path.is_file():
              title = title_path.read_text(encoding="utf-8").strip().splitlines()[0]

          title = re.sub(r"\s+", " ", title or topic or "Katha Lok AI Story")[:100]

          story_text = ""
          story_path = output / "story" / "story.json"
          if story_path.is_file():
              try:
                  data = json.loads(story_path.read_text(encoding="utf-8"))
                  chunks = []
                  for part in data.get("parts", []):
                      for scene in part.get("scenes", []):
                          text = scene.get("narration", scene.get("text", ""))
                          if text:
                              chunks.append(str(text).strip())
                  story_text = " ".join(chunks)
              except (ValueError, OSError, TypeError) as exc:
                  print("WARNING: story.json could not be parsed:", exc)

          story_text = re.sub(r"\s+", " ", story_text).strip()
          description = title + "\n\n"
          description += story_text[:2500] if story_text else (
              "A Katha Lok AI story based on: " + (topic or title)
          )
          if len(story_text) > 2500:
              description += "..."
          description += (
              "\n\nWatch till the end and share your thoughts in the comments."
              "\n\n#KathaLokAI #HindiKahani"
          )

          words = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+",
              title + " " + topic + " " + story_text[:5000]
          )
          tags = []
          seen = set()
          for word in words + [
              "Katha Lok AI", "Hindi story", "Hindi kahani",
              "Hindi storytelling"
          ]:
              key = word.casefold()
              if len(word) >= 3 and key not in seen:
                  seen.add(key)
                  tags.append(word)
              if len(tags) >= 20:
                  break

          metadata = (
              f"Title:\n{title}\n\n"
              f"Description:\n\n{description}\n\n"
              f"Tags:\n{', '.join(tags)}\n"
          )
          path = output / "youtube_metadata.txt"
          path.write_text(metadata, encoding="utf-8")
          print(metadata)
          PY

      - name: Sync captioned format alias and validate
        shell: bash
        run: |
          set -euo pipefail

          FINAL="output/videos/katha_lok_ai_final.mp4"
          test -s "$FINAL"

          FORMAT=$(python - <<'PY'
          from pathlib import Path
          values = {}
          for line in Path("Input/topic.txt").read_text(
              encoding="utf-8-sig"
          ).splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip().upper()] = value.split("#", 1)[0].strip().strip("'\"")
          print(values.get("FORMAT", "short").lower())
          PY
          )

          case "$FORMAT" in
            full|long|landscape|youtube|youtube_full|youtube-long)
              ALIAS="output/videos/katha_lok_ai_full.mp4"
              ;;
            *)
              ALIAS="output/videos/katha_lok_ai_short.mp4"
              ;;
          esac

          cp "$FINAL" "$ALIAS"
          test -s "$ALIAS"

          python scripts/validate_final_output.py

          echo "===== Final output inventory ====="
          find output -maxdepth 5 -type f -print

          echo "===== Final MP4 details ====="
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height \
            -of json "$FINAL"

      - name: Create final ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r katha-lok-ai-photo-motion-output.zip output
          test -s katha-lok-ai-photo-motion-output.zip
          ls -lh katha-lok-ai-photo-motion-output.zip

      - name: Upload final output artifact
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-output
          path: |
            output/**
            katha-lok-ai-photo-motion-output.zip
          if-no-files-found: error
          retention-days: 7
