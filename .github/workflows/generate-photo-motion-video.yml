        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-motion-production-review
          if-no-files-found: ignore
          path: |
            output/production/
            output/visuals/storyboard.jpg
            output/visuals/storyboard_manifest.json
            output/visuals/asset_approval.json
            output/production_report.json
