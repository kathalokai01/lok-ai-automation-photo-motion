name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow edge-tts gradio_client

      - name: Check input
        shell: bash
        run: |
          set -e
          echo "============================================================"
          echo "INPUT"
          echo "============================================================"

          if [ -f "Input/topic.txt" ]; then
            cat "Input/topic.txt"
          else
            echo "ERROR: Input/topic.txt not found"
            exit 1
          fi

      - name: Generate story plan
        run: python scripts/generate_story_plan.py

      - name: Generate story
        run: python scripts/generate_story.py

      # IMPORTANT: select and test the model BEFORE AI story generation.
      - name: Select Gemini model
        run: python scripts/select_gemini_model.py

      - name: Test selected Gemini model
        run: python scripts/test_gemini.py

      - name: Generate AI story
        run: python scripts/generate_ai_story.py

      - name: Generate character bible
        run: python scripts/generate_character_bible.py

      - name: Generate scenes
        run: python scripts/generate_scenes.py

      - name: Generate narration jobs
        run: python scripts/generate_narration.py

      - name: Generate Hindi TTS
        run: python scripts/generate_tts.py

      - name: Prepare visual jobs
        run: python scripts/generate_visuals.py

      - name: Generate free realistic scene images
        run: python scripts/free_image_generator.py

      - name: Verify generated images
        shell: bash
        run: |
          set -e

          if [ ! -d "output/visuals" ]; then
            echo "ERROR: output/visuals does not exist"
            exit 1
          fi

          COUNT=$(find output/visuals -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            | wc -l)

          echo "Image count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No scene images generated"
            exit 1
          fi

          find output/visuals -maxdepth 2 -type f -print

      - name: Create Photo Motion scene videos
        run: python scripts/photo_motion.py

      - name: Render final video
        run: python scripts/render_video.py

      - name: Generate thumbnail
        run: python scripts/generate_thumbnail.py || true

      # STORY-SPECIFIC YOUTUBE METADATA
      - name: Create dynamic YouTube metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          output = Path("output")
          output.mkdir(parents=True, exist_ok=True)

          topic_path = Path("Input/topic.txt")
          topic = (
              topic_path.read_text(encoding="utf-8").strip()
              if topic_path.exists()
              else ""
          )
          topic = re.sub(r"\s+", " ", topic)

          text_parts = []
          story_title = ""

          for folder in (output, Path("Input")):
              if not folder.exists():
                  continue

              for path in folder.rglob("*"):
                  if not path.is_file():
                      continue

                  if path.name.lower() in {
                      "youtube_metadata.txt",
                      "final_title.txt",
                  }:
                      if path.name.lower() == "final_title.txt":
                          try:
                              candidate = path.read_text(
                                  encoding="utf-8"
                              ).strip()
                              if candidate and not story_title:
                                  story_title = candidate.splitlines()[0].strip()
                          except (OSError, UnicodeError):
                              pass
                      continue

                  if path.suffix.lower() not in {
                      ".txt", ".md", ".json"
                  }:
                      continue

                  try:
                      content = path.read_text(
                          encoding="utf-8"
                      ).strip()
                  except (OSError, UnicodeError):
                      continue

                  if not content:
                      continue

                  if path.suffix.lower() == ".json":
                      try:
                          data = json.loads(content)
                          if isinstance(data, dict):
                              for key in (
                                  "title",
                                  "story_title",
                                  "topic",
                                  "name",
                              ):
                                  value = data.get(key)
                                  if (
                                      isinstance(value, str)
                                      and value.strip()
                                      and not story_title
                                  ):
                                      story_title = value.strip()
                                      break
                      except (json.JSONDecodeError, ValueError):
                          pass
                  else:
                      text_parts.append(content)

          title = story_title or topic or "Katha Lok AI Hindi Story"
          title = re.sub(r"\s+", " ", title).strip()[:100].rstrip()

          combined_story = " ".join(text_parts)
          combined_story = re.sub(
              r"\s+", " ", combined_story
          ).strip()

          if combined_story:
              combined_story = combined_story[:2500].rstrip()
              if len(combined_story) == 2500:
                  combined_story = (
                      combined_story.rsplit(" ", 1)[0] + "..."
                  )

              description = (
                  f"{title}\n\n"
                  f"{combined_story}\n\n"
                  "Watch the story till the end and share "
                  "your thoughts in the comments."
              )
          else:
              description = (
                  f"{title}\n\n"
                  "Watch this Hindi story from Katha Lok AI. "
                  f"This video is based on the topic: {topic or title}.\n\n"
                  "Share your thoughts in the comments."
              )

          tag_source = " ".join([
              title,
              topic,
              combined_story[:5000],
          ])

          words = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+",
              tag_source,
          )

          dynamic_tags = []
          seen = set()

          for word in words:
              word = word.strip()
              normalized = word.casefold()

              if len(word) < 3 or normalized in seen:
                  continue

              seen.add(normalized)
              dynamic_tags.append(word)

          fixed_tags = [
              "Katha Lok AI",
              "Hindi story",
              "Hindi kahani",
              "Hindi storytelling",
          ]

          tags = []
          tag_seen = set()

          for tag in dynamic_tags + fixed_tags:
              normalized = tag.casefold()
              if normalized not in tag_seen:
                  tag_seen.add(normalized)
                  tags.append(tag)

          tags = tags[:20]

          hashtag_words = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+",
              title,
          )

          title_hashtag = "".join(hashtag_words[:3])
          hashtags = ["#KathaLokAI", "#HindiKahani"]

          if title_hashtag:
              story_hashtag = "#" + title_hashtag
              if story_hashtag.casefold() not in {
                  item.casefold() for item in hashtags
              }:
                  hashtags.append(story_hashtag)

          description += "\n\n" + " ".join(hashtags)

          metadata = (
              f"Title:\n{title}\n\n"
              f"Description:\n\n{description}\n\n"
              f"Tags:\n{', '.join(tags)}\n"
          )

          metadata_path = output / "youtube_metadata.txt"
          metadata_path.write_text(metadata, encoding="utf-8")

          print("Dynamic YouTube metadata created:")
          print(metadata)
          PY

      - name: Check final output
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "FINAL OUTPUT"
          echo "============================================================"

          find output -maxdepth 4 -type f -print

          if ! find output -type f -iname "*.mp4" -print -quit | grep -q .; then
            echo "ERROR: No MP4 video found in output"
            exit 1
          fi

          if [ ! -s "output/youtube_metadata.txt" ]; then
            echo "ERROR: YouTube metadata is missing or empty"
            exit 1
          fi

      - name: Create final ZIP
        shell: bash
        run: |
          set -e
          cd output
          zip -r ../katha-lok-ai-photo-motion-output.zip .
          cd ..
          ls -lh katha-lok-ai-photo-motion-output.zip

      - name: Upload final output
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-output
          path: |
            output/**
            katha-lok-ai-photo-motion-output.zip
          if-no-files-found: error
          retention-days: 7