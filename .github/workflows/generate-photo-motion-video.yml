name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: katha-photo-motion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
      FISH_TTS_MODEL: ${{ vars.FISH_TTS_MODEL }}

      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}

      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}

      FINEVOICE_API_KEY: ${{ secrets.FINEVOICE_API_KEY }}
      FINEVOICE_VOICE_ID: ${{ secrets.FINEVOICE_VOICE_ID }}

      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_TTS_VOICE_ID: ${{ secrets.MINIMAX_TTS_VOICE_ID }}
      MINIMAX_TTS_MODEL: ${{ vars.MINIMAX_TTS_MODEL }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

      ALLOW_BILLABLE_PROVIDERS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate input and code fingerprints
        id: fingerprints
        shell: bash
        run: |
          set -euo pipefail
          test -s Input/topic.txt

          INPUT_HASH="$(sha256sum Input/topic.txt | awk '{print $1}')"

          {
            sha256sum Input/topic.txt
            find scripts -type f -name '*.py' -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
            sha256sum .github/workflows/generate-photo-motion-video.yml
          } > /tmp/katha-code-files.sha256

          CODE_HASH="$(sha256sum /tmp/katha-code-files.sha256 | awk '{print $1}')"

          echo "input_hash=$INPUT_HASH" >> "$GITHUB_OUTPUT"
          echo "code_hash=$CODE_HASH" >> "$GITHUB_OUTPUT"

          echo "Input fingerprint: $INPUT_HASH"
          echo "Code fingerprint: $CODE_HASH"

      - name: Restore compatible checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_INPUT_HASH: ${{ steps.fingerprints.outputs.input_hash }}
          CURRENT_CODE_HASH: ${{ steps.fingerprints.outputs.code_hash }}
        run: |
          set -euo pipefail
          mkdir -p output
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          RUN_IDS="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow generate-photo-motion-video.yml \
            --limit 20 \
            --json databaseId,status \
            --jq '.[] | select(.status == "completed") | .databaseId' \
            2>/dev/null || true)"

          for RUN_ID in $RUN_IDS; do
            DEST="$TEMP_DIR/$RUN_ID"
            mkdir -p "$DEST"

            if ! gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "katha-photo-motion-checkpoint-$RUN_ID" \
              --dir "$DEST" 2>/dev/null; then
              continue
            fi

            if [ ! -s "$DEST/checkpoint.zip" ]; then
              continue
            fi

            mkdir -p "$DEST/extracted"
            if ! unzip -q "$DEST/checkpoint.zip" -d "$DEST/extracted"; then
              continue
            fi

            SAVED_OUTPUT="$DEST/extracted/output"
            INPUT_FILE="$SAVED_OUTPUT/.resume-input.sha256"
            CODE_FILE="$SAVED_OUTPUT/.resume-code.sha256"

            if [ ! -s "$INPUT_FILE" ] || [ ! -s "$CODE_FILE" ]; then
              echo "Skipping checkpoint without both fingerprints: $RUN_ID"
              continue
            fi

            if [ "$(cat "$INPUT_FILE")" != "$CURRENT_INPUT_HASH" ]; then
              continue
            fi

            if [ "$(cat "$CODE_FILE")" != "$CURRENT_CODE_HASH" ]; then
              echo "Skipping checkpoint from another code version: $RUN_ID"
              continue
            fi

            cp -a "$SAVED_OUTPUT/." output/
            echo "Compatible checkpoint restored from run $RUN_ID."
            exit 0
          done

          echo "No compatible checkpoint found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-photo-motion-py311-${{ hashFiles('.github/workflows/generate-photo-motion-video.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-photo-motion-py311-

      - name: Install FFmpeg and font tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg zip unzip fontconfig \
            fonts-noto-core fonts-noto-extra
          fc-cache -f
          ffmpeg -version
          ffprobe -version
          fc-match "Noto Sans Devanagari"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            requests pillow edge-tts gradio_client \
            huggingface_hub opencv-python-headless
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers

      - name: Install free Hindi caption fonts
        run: |
          set -euo pipefail
          test -s scripts/install_caption_fonts.py
          python scripts/install_caption_fonts.py
          fc-cache -f
          fc-match "Noto Sans Devanagari"
          fc-match "Mukta"
          fc-match "Hind"
          fc-match "Tiro Devanagari Hindi"

      - name: Create Hindi font and size preview
        run: |
          set -euo pipefail
          test -s scripts/preview_caption_fonts.py
          python scripts/preview_caption_fonts.py
          test -s output/captions/caption_font_preview.png
          test -s output/captions/caption_font_preview.json

      - name: Check input and required scripts
        run: |
          set -euo pipefail
          test -s Input/topic.txt

          for file in \
            scripts/input_config.py \
            scripts/select_gemini_model.py \
            scripts/generate_story_plan.py \
            scripts/generate_story.py \
            scripts/generate_ai_story.py \
            scripts/generate_character_bible.py \
            scripts/generate_scenes.py \
            scripts/generate_narration.py \
            scripts/prepare_captions.py \
            scripts/generate_tts.py \
            scripts/generate_visuals.py \
            scripts/free_image_generator.py \
            scripts/generate_depth_maps.py \
            scripts/depth_parallax.py \
            scripts/photo_motion.py \
            scripts/generate_sound_design.py \
            scripts/render_video.py \
            scripts/install_caption_fonts.py \
            scripts/preview_caption_fonts.py \
            scripts/burn_captions.py \
            scripts/generate_thumbnail.py \
            scripts/validate_final_output.py
          do
            test -s "$file" || {
              echo "Missing required script: $file"
              exit 1
            }
          done

          python - <<'PY'
          from scripts.input_config import load_and_validate, print_config_summary

          config = load_and_validate("Input/topic.txt")
          print_config_summary(config)
          PY

      - name: Select Gemini model
        run: python scripts/select_gemini_model.py

      - name: Generate story plan
        run: python scripts/generate_story_plan.py

      - name: Generate story
        run: python scripts/generate_story.py

      - name: Generate AI story
        run: python scripts/generate_ai_story.py

      - name: Generate character bible
        run: python scripts/generate_character_bible.py

      - name: Generate scenes
        run: python scripts/generate_scenes.py

      - name: Prepare narration jobs
        run: python scripts/generate_narration.py

      - name: Prepare captions
        run: python scripts/prepare_captions.py

      - name: Generate narration audio
        run: python scripts/generate_tts.py

      - name: Prepare visual jobs
        run: python scripts/generate_visuals.py

      - name: Generate scene images
        run: python scripts/free_image_generator.py

      - name: Generate depth maps
        run: python scripts/generate_depth_maps.py

      - name: Render photo-motion clips
        run: python scripts/photo_motion.py

      - name: Generate free background audio and timed SFX cues
        run: python scripts/generate_sound_design.py

      - name: Render scene audio, parts and final video
        run: python scripts/render_video.py

      - name: Burn captions into video
        run: python scripts/burn_captions.py

      - name: Generate requested-format thumbnail
        run: python scripts/generate_thumbnail.py

      - name: Generate topic-based metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          output = Path("output")
          values = {}

          for line in Path("Input/topic.txt").read_text(
              encoding="utf-8-sig"
          ).splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue

              key, value = line.split("=", 1)
              values[key.strip().upper()] = (
                  value.split("#", 1)[0].strip().strip("'\"")
              )

          def clean(value):
              return re.sub(r"\s+", " ", str(value or "")).strip()

          topic = clean(values.get("TOPIC", ""))
          title_file = output / "story" / "final_title.txt"
          title = ""

          if title_file.is_file():
              lines = title_file.read_text(
                  encoding="utf-8-sig"
              ).splitlines()
              if lines:
                  title = clean(lines[0])

          title = (title or topic or "Katha Lok AI Story")[:100]

          description = (
              f"{title}\n\n"
              f"Watch this Katha Lok AI story about {topic or title}. "
              "Enjoy the cinematic storytelling, narration and "
              "scene-by-scene visuals.\n\n"
              "#KathaLokAI #HindiKahani"
          )

          tokens = re.findall(
              r"[A-Za-z0-9]+|[\u0900-\u097F]+",
              f"{title} {topic}",
          )

          tags = []
          seen = set()

          for tag in tokens + [
              "Katha Lok AI",
              "Hindi story",
              "Hindi kahani",
              "Hindi storytelling",
          ]:
              key = tag.casefold()
              if len(tag) >= 3 and key not in seen:
                  seen.add(key)
                  tags.append(tag)
              if len(tags) >= 20:
                  break

          metadata = (
              f"Title:\n{title}\n\n"
              f"Description:\n\n{description}\n\n"
              f"Tags:\n{', '.join(tags)}\n"
          )

          output.mkdir(parents=True, exist_ok=True)
          (output / "youtube_metadata.txt").write_text(
              metadata, encoding="utf-8"
          )
          print("Topic-based metadata generated.")
          PY

      - name: Validate final deliverables
        run: python scripts/validate_final_output.py

      - name: Create output ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f katha-lok-ai-photo-motion-output.zip
          zip -qr katha-lok-ai-photo-motion-output.zip output
          test -s katha-lok-ai-photo-motion-output.zip
          ls -lh katha-lok-ai-photo-motion-output.zip

      - name: Upload final output artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: katha-lok-ai-photo-motion-output
          path: |
            output/**
            katha-lok-ai-photo-motion-output.zip
          if-no-files-found: error
          retention-days: 7

      - name: Save resumable checkpoint
        if: always()
        shell: bash
        env:
          INPUT_HASH: ${{ steps.fingerprints.outputs.input_hash }}
          CODE_HASH: ${{ steps.fingerprints.outputs.code_hash }}
        run: |
          set -euo pipefail
          mkdir -p output

          printf '%s\n' "$INPUT_HASH" > output/.resume-input.sha256
          printf '%s\n' "$CODE_HASH" > output/.resume-code.sha256

          rm -f checkpoint.zip
          zip -qr checkpoint.zip output
          test -s checkpoint.zip

      - name: Upload checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katha-photo-motion-checkpoint-${{ github.run_id }}
          path: checkpoint.zip
          if-no-files-found: warn
          retention-days: 7