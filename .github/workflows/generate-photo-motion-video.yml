name: Generate Katha Lok AI Photo Motion Video

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Output mode for this run"
        required: true
        type: choice
        options:
          - short
          - full
        default: short

permissions:
  contents: read
  actions: read

concurrency:
  group: katha-photo-motion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PHOTO_MOTION_FORMAT: ${{ inputs.format }}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALLOW_GEMINI_GENERATION: "I_ACCEPT_POTENTIAL_GEMINI_CHARGES"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      FLOW_MUSIC_MODEL: ${{ vars.FLOW_MUSIC_MODEL }}
      MUSIC_ALLOW_PAID: ${{ vars.MUSIC_ALLOW_PAID }}
      ELEVEN_MUSIC_MODEL: ${{ vars.ELEVEN_MUSIC_MODEL }}
      STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
      STABLE_AUDIO_MODEL: ${{ vars.STABLE_AUDIO_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_MODEL_FALLBACKS: ${{ vars.GEMINI_MODEL_FALLBACKS }}

      LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER }}

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}

      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}


      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
      FISH_TTS_MODEL: ${{ vars.FISH_TTS_MODEL }}

      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
      GEMINI_TTS_VOICE_CHILD_FRIENDLY: ${{ vars.GEMINI_TTS_VOICE_CHILD_FRIENDLY }}
      GEMINI_TTS_VOICE_FEMALE_STORYTELLER: ${{ vars.GEMINI_TTS_VOICE_FEMALE_STORYTELLER }}
      GEMINI_TTS_VOICE_MALE_STORYTELLER: ${{ vars.GEMINI_TTS_VOICE_MALE_STORYTELLER }}
      GEMINI_TTS_VOICE_CHARACTER: ${{ vars.GEMINI_TTS_VOICE_CHARACTER }}
      EDGE_TTS_VOICE_CHILD_FRIENDLY: ${{ vars.EDGE_TTS_VOICE_CHILD_FRIENDLY }}
      EDGE_TTS_VOICE_FEMALE_STORYTELLER: ${{ vars.EDGE_TTS_VOICE_FEMALE_STORYTELLER }}
      EDGE_TTS_VOICE_MALE_STORYTELLER: ${{ vars.EDGE_TTS_VOICE_MALE_STORYTELLER }}
      EDGE_TTS_VOICE_CHARACTER: ${{ vars.EDGE_TTS_VOICE_CHARACTER }}

      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_VOICE_ID_CHILD_FRIENDLY: ${{ secrets.ELEVENLABS_VOICE_ID_CHILD_FRIENDLY }}
      ELEVENLABS_VOICE_ID_FEMALE_STORYTELLER: ${{ secrets.ELEVENLABS_VOICE_ID_FEMALE_STORYTELLER }}
      ELEVENLABS_VOICE_ID_MALE_STORYTELLER: ${{ secrets.ELEVENLABS_VOICE_ID_MALE_STORYTELLER }}
      ELEVENLABS_VOICE_ID_CHARACTER: ${{ secrets.ELEVENLABS_VOICE_ID_CHARACTER }}

      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}

      FINEVOICE_API_KEY: ${{ secrets.FINEVOICE_API_KEY }}
      FINEVOICE_VOICE_ID: ${{ secrets.FINEVOICE_VOICE_ID }}

      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_TTS_VOICE_ID: ${{ secrets.MINIMAX_TTS_VOICE_ID }}
      MINIMAX_TTS_MODEL: ${{ vars.MINIMAX_TTS_MODEL }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      CLOUDFLARE_IMAGE_API_TOKEN: ${{ secrets.CLOUDFLARE_IMAGE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
      CLOUDFLARE_IMAGE_FALLBACK_MODEL: ${{ vars.CLOUDFLARE_IMAGE_FALLBACK_MODEL }}
      OVHCLOUD_AI_ENDPOINTS_API_KEY: ${{ secrets.OVHCLOUD_AI_ENDPOINTS_API_KEY }}
      OVHCLOUD_IMAGE_MODEL: ${{ vars.OVHCLOUD_IMAGE_MODEL }}
      AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
      AIHORDE_IMAGE_MODEL: ${{ vars.AIHORDE_IMAGE_MODEL }}
      AIHORDE_CLIENT_AGENT: "katha-lok-photo-motion:1.0:github"

      POLLINATIONS_FREE_IMAGE_MODELS: "black-forest-labs/flux.1-schnell,tongyi-mai/z-image-turbo,lykon/dreamshaper-8-lcm"
      ALLOW_BILLABLE_PROVIDERS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Python environment cache
        id: python-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ runner.arch }}-python311-${{ hashFiles('requirements.txt') }}-torch-cpu-v1

      - name: Restore Hindi fonts cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/katha-caption
          key: ${{ runner.os }}-${{ runner.arch }}-hindi-fonts-v6

      - name: Restore FFmpeg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/katha-photo-motion/ffmpeg-bin
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-v1

      - name: Validate repository files and configuration
        shell: bash
        run: |
          set -euo pipefail

          test -s Input/topic.txt
          test -s requirements.txt

          required_files=(
            scripts/input_config.py
            scripts/story_length_policy.py
            scripts/select_gemini_model.py
            scripts/check_gemini_guard.py
            scripts/gemini_api_guard.py
            scripts/gemini_http.py
            scripts/select_visual_model.py
            scripts/test_gemini.py
            scripts/llm_provider_client.py
            scripts/select_llm_provider.py
            scripts/test_llm_providers.py
            scripts/generate_story.py
            scripts/validate_story_length.py
            scripts/verify_story.py
            scripts/generate_story_plan.py
            scripts/generate_ai_story.py
            scripts/story_quality_validator.py
            scripts/generate_character_bible.py
            scripts/generate_scenes.py
            scripts/generate_narration.py
            scripts/voice_profiles.py
            scripts/preview_voice.py
            scripts/music_provider_client.py
            scripts/prepare_captions.py
            scripts/generate_tts.py
            scripts/generate_flow_music.py
            scripts/generate_visuals.py
            scripts/free_image_generator.py
            scripts/image_provider_adapters.py
            scripts/build_visual_storyboard.py
            scripts/render_quality_validator.py
            scripts/production_report.py
            scripts/visual_quality_validator.py
            scripts/prepare_visuals.py
            scripts/generate_depth_maps.py
            scripts/depth_parallax.py
            scripts/photo_motion.py
            scripts/generate_sound_design.py
            scripts/validate_sfx_timing.py
            scripts/render_video.py
            scripts/install_caption_fonts.py
            scripts/preview_caption_fonts.py
            scripts/burn_captions.py
            scripts/generate_thumbnail.py
            scripts/generate_youtube_metadata.py
            scripts/validate_final_output.py
            scripts/package_output.py
            scripts/pipeline_preflight.py
            scripts/checkpoint_manager.py
            scripts/production_events.py
            scripts/production_dashboard.py
            scripts/asset_approval.py
            scripts/production_cost_tracker.py
            scripts/render_preview.py
            scripts/render_templates.py
            scripts/image_processing_profiles.py
            scripts/production_batch.py
            scripts/production_presets.py
          )

          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required file missing or empty: $file"
              exit 1
            fi
          done

          python -m py_compile "${required_files[@]}"

          python - <<'PY'
          from pathlib import Path
          from scripts.input_config import (
              load_and_validate,
              get_format,
              get_parts_range,
              get_selected_parts,
              get_scenes_range,
              get_fps,
              get_tts_provider_order,
              get_image_provider_order,
              get_global_billable_permission,
          )

          config = load_and_validate(Path("Input/topic.txt"))

          mode = str(get_format(config)).strip().lower()
          parts_min, parts_max = get_parts_range(config)
          selected = get_selected_parts(config, required=False)
          scenes_min, scenes_max = get_scenes_range(config)
          fps = get_fps(config)
          tts = get_tts_provider_order(config)
          images = get_image_provider_order(config)

          if mode not in {"short", "full"}:
              raise SystemExit(f"Invalid FORMAT: {mode}")

          if parts_min < 1 or parts_max < parts_min:
              raise SystemExit("Invalid PARTS range.")

          if selected is not None and not parts_min <= selected <= parts_max:
              raise SystemExit("Selected PARTS is outside configured range.")

          if scenes_min < 1 or scenes_max < scenes_min:
              raise SystemExit("Invalid SCENES range.")

          if not 1 <= int(fps) <= 60:
              raise SystemExit(f"Invalid FPS: {fps}")

          if len(tts) < 3 or len(set(tts)) != len(tts):
              raise SystemExit("TTS provider fallback order is invalid.")

          if not images or len(set(images)) != len(images):
              raise SystemExit("Image provider fallback order is invalid.")

          if not get_global_billable_permission(config):
              raise SystemExit("Billable providers are not enabled.")

          print("INPUT CONFIGURATION VALID")
          print("FORMAT:", mode)
          print("PARTS RANGE:", parts_min, "-", parts_max)
          print("SELECTED PARTS:", selected if selected is not None else "pending")
          print("SCENES RANGE:", scenes_min, "-", scenes_max)
          print("FPS:", fps)
          print("TTS FALLBACK ORDER:", " -> ".join(tts))
          print("IMAGE FALLBACK ORDER:", " -> ".join(images))
          print("BILLABLE PROVIDERS: enabled")
          print("LLM BILLABLE PROVIDERS:", "permitted by configured credentials and model settings")
          PY

      - name: Calculate input and pipeline fingerprints
        id: fingerprints
        shell: bash
        run: |
          set -euo pipefail

          INPUT_HASH="$(sha256sum Input/topic.txt | awk '{print $1}')"

          {
            sha256sum .github/workflows/generate-photo-motion-video.yml
            sha256sum requirements.txt
            find scripts -type f -name '*.py' -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
          } > /tmp/katha-photo-motion-pipeline.sha256

          PIPELINE_HASH="$(
            sha256sum /tmp/katha-photo-motion-pipeline.sha256 \
              | awk '{print $1}'
          )"

          STORY_CODE_HASH="$(sha256sum scripts/generate_story.py | awk '{print $1}')"

          echo "input_hash=$INPUT_HASH" >> "$GITHUB_OUTPUT"
          echo "pipeline_hash=$PIPELINE_HASH" >> "$GITHUB_OUTPUT"
          echo "story_code_hash=$STORY_CODE_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore matching resumable checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_INPUT_HASH: ${{ steps.fingerprints.outputs.input_hash }}
        run: |
          set -euo pipefail
          python scripts/checkpoint_manager.py restore \
            --repository "$GITHUB_REPOSITORY" \
            --workflow generate-photo-motion-video.yml \
            --branch "$GITHUB_REF_NAME" \
            --limit 30 \
            --input-hash "$CURRENT_INPUT_HASH" \
            --output output

      - name: Check and install only missing system tools
        shell: bash
        run: |
          set -euo pipefail

          CACHE_BIN="$HOME/.cache/katha-photo-motion/ffmpeg-bin"
          mkdir -p "$CACHE_BIN"

          if [ -x "$CACHE_BIN/ffmpeg" ] &&
             [ -x "$CACHE_BIN/ffprobe" ] &&
             "$CACHE_BIN/ffmpeg" -version >/dev/null 2>&1 &&
             "$CACHE_BIN/ffprobe" -version >/dev/null 2>&1; then
            echo "VALID FFmpeg CACHE REUSED"
            echo "$CACHE_BIN" >> "$GITHUB_PATH"
          else
            rm -f "$CACHE_BIN/ffmpeg" "$CACHE_BIN/ffprobe"
          fi

          missing_packages=()

          if ! command -v ffmpeg >/dev/null 2>&1 &&
             [ ! -x "$CACHE_BIN/ffmpeg" ]; then
            missing_packages+=(ffmpeg)
          fi

          if ! command -v ffprobe >/dev/null 2>&1 &&
             [ ! -x "$CACHE_BIN/ffprobe" ]; then
            missing_packages+=(ffmpeg)
          fi

          command -v zip >/dev/null 2>&1 || missing_packages+=(zip)
          command -v unzip >/dev/null 2>&1 || missing_packages+=(unzip)

          if ! command -v fc-cache >/dev/null 2>&1 ||
             ! command -v fc-match >/dev/null 2>&1 ||
             ! command -v fc-scan >/dev/null 2>&1; then
            missing_packages+=(fontconfig)
          fi

          if [ "${#missing_packages[@]}" -gt 0 ]; then
            mapfile -t unique_packages < <(
              printf '%s\n' "${missing_packages[@]}" | sort -u
            )
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              "${unique_packages[@]}"
          else
            echo "SYSTEM TOOLS ALREADY AVAILABLE"
          fi

          if [ ! -x "$CACHE_BIN/ffmpeg" ] ||
             ! "$CACHE_BIN/ffmpeg" -version >/dev/null 2>&1; then
            SYSTEM_FFMPEG="$(command -v ffmpeg || true)"
            SYSTEM_FFPROBE="$(command -v ffprobe || true)"

            if [ -n "$SYSTEM_FFMPEG" ] && [ -n "$SYSTEM_FFPROBE" ]; then
              cp "$SYSTEM_FFMPEG" "$CACHE_BIN/ffmpeg"
              cp "$SYSTEM_FFPROBE" "$CACHE_BIN/ffprobe"
              chmod 755 "$CACHE_BIN/ffmpeg" "$CACHE_BIN/ffprobe"
            fi
          fi

          if [ -x "$CACHE_BIN/ffmpeg" ] &&
             [ -x "$CACHE_BIN/ffprobe" ] &&
             "$CACHE_BIN/ffmpeg" -version >/dev/null 2>&1 &&
             "$CACHE_BIN/ffprobe" -version >/dev/null 2>&1; then
            echo "$CACHE_BIN" >> "$GITHUB_PATH"
          else
            command -v ffmpeg
            command -v ffprobe
          fi

          command -v zip
          command -v unzip
          fc-cache --version
          fc-match "sans-serif" >/dev/null

      - name: Restore or install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          VENV="$GITHUB_WORKSPACE/.venv"
          STAMP="$VENV/.katha-dependency-signature"
          REQUIREMENTS_HASH="$(sha256sum requirements.txt | awk '{print $1}')"
          SIGNATURE="python311|torch-cpu-v1|${REQUIREMENTS_HASH}"

          valid_environment() {
            [ -x "$VENV/bin/python" ] &&
            [ -s "$STAMP" ] &&
            [ "$(cat "$STAMP")" = "$SIGNATURE" ] &&
            "$VENV/bin/python" - <<'PY'
          import importlib

          modules = (
              "cv2", "edge_tts", "gradio_client",
              "huggingface_hub", "numpy", "PIL",
              "requests", "torch", "transformers",
              "librosa", "sentencepiece", "soundfile",
          )

          for module in modules:
              importlib.import_module(module)
          PY
          }

          if valid_environment; then
            echo "VALID PYTHON ENVIRONMENT CACHE REUSED"
          else
            rm -rf "$VENV"
            python -m venv "$VENV"
            source "$VENV/bin/activate"

            python -m pip install \
              --upgrade pip setuptools wheel

            python -m pip install torch \
              --index-url https://download.pytorch.org/whl/cpu

            python -m pip install -r requirements.txt

            python - <<'PY'
          import cv2
          import edge_tts
          import gradio_client
          import huggingface_hub
          import numpy
          import PIL
          import requests
          import torch
          import transformers
          import librosa
          import sentencepiece
          import soundfile

          print("Python dependencies imported successfully.")
          print("OpenCV:", cv2.__version__)
          print("NumPy:", numpy.__version__)
          print("Pillow:", PIL.__version__)
          print("PyTorch:", torch.__version__)
          print("Transformers:", transformers.__version__)
          PY

            printf '%s' "$SIGNATURE" > "$STAMP"
          fi

          source "$VENV/bin/activate"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          python -m pip check

      - name: Install and verify Hindi caption fonts
        shell: bash
        run: |
          set -euo pipefail

          python scripts/install_caption_fonts.py

          test -s output/fonts/font_manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/fonts/font_manifest.json")
          if not path.is_file():
              path = Path("output/font_manifest.json")

          if not path.is_file():
              raise SystemExit("Caption font manifest was not created.")

          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("status") != "completed":
              raise SystemExit("Caption font installation is incomplete.")

          selected = data.get("selected_hindi_font")
          if not isinstance(selected, dict) or not selected.get("family"):
              raise SystemExit("No verified Hindi caption font was selected.")

          print("VERIFIED HINDI FONT:", selected["family"])
          PY

      - name: Compile Python pipeline and tests
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q scripts

      - name: Test scene role narration and final scene validation
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test configured paid and free LLM provider fallback
        shell: bash
        run: |
          set -euo pipefail

          python scripts/test_llm_providers.py

      - name: Run strict Photo Motion preflight
        shell: bash
        run: |
          set -euo pipefail

          python scripts/pipeline_preflight.py

          test -s output/preflight_report.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/preflight_report.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          if report.get("ready_to_run") is not True:
              failures = report.get("failures", [])
              for item in failures:
                  print(
                      "PREFLIGHT BLOCKER:",
                      item.get("name"),
                      "-",
                      item.get("detail"),
                  )
              raise SystemExit("Photo Motion preflight blocked generation.")

          if report.get("api_calls_made") != 0:
              raise SystemExit("Preflight must not make API calls.")

          if report.get("generation_performed") is not False:
              raise SystemExit("Preflight must not perform generation.")

          print("PHOTO MOTION PREFLIGHT PASSED")
          print("CHECKS:", report.get("checks_total"))
          print("API CALLS: 0")
          PY

      - name: Compile-check all pipeline scripts
        run: python -m compileall -q scripts

      - name: Select configured Gemini model priority
        shell: bash
        run: |
          set -euo pipefail

          python scripts/select_gemini_model.py

          test -s output/config/selected_model.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/config/selected_model.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("status") != "selected":
              raise SystemExit("Gemini model selection failed.")

          model = data.get("model")
          order = data.get("fallback_order")

          if not isinstance(model, str) or not model.strip():
              raise SystemExit("Gemini primary model is missing.")

          if not isinstance(order, list) or not order or order[0] != model:
              raise SystemExit("Gemini fallback order is invalid.")

          if data.get("generation_test_performed") is not False:
              raise SystemExit("Gemini selector must not generate content.")

          print("GEMINI PRIORITY VERIFIED")
          print("PRIMARY:", model)
          print("FALLBACK COUNT:", len(order) - 1)
          print("NO GENERATION TEST PERFORMED")
          PY

      - name: Select all configured LLM fallbacks
        shell: bash
        run: |
          set -euo pipefail

          python scripts/select_llm_provider.py

          test -s output/config/selected_llm_provider.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/config/selected_llm_provider.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("api_calls_made") != 0:
              raise SystemExit("Provider selector unexpectedly made API calls.")

          if data.get("generation_performed") is not False:
              raise SystemExit("Provider selector must not generate content.")

          order = data.get("provider_order")
          if not isinstance(order, list):
              raise SystemExit("Provider order is invalid.")

          if data.get("status") not in {
              "ready",
              "no_provider_ready",
          }:
              raise SystemExit(
                  "Unexpected LLM provider selector status: "
                  + str(data.get("status"))
              )

          print("LLM PROVIDER SELECTION VERIFIED")
          print("STATUS:", data.get("status"))
          print("ORDER:", " -> ".join(order) if order else "none")
          print("API CALLS: 0")
          PY

      - name: Generate or reuse corrected story
        run: python scripts/generate_story.py

      - name: Validate story length and part boundaries
        run: python scripts/validate_story_length.py

      - name: Verify story preservation and consistency
        run: python scripts/verify_story.py

      - name: Generate complete story plan
        run: python scripts/generate_story_plan.py

      - name: Verify configured SCENES range for every Part
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          from scripts.input_config import (
              load_and_validate,
              get_scenes_range,
          )

          config = load_and_validate("Input/topic.txt")
          minimum, maximum = get_scenes_range(config)

          path = Path("output/story/story_plan.json")
          if not path.is_file():
              raise SystemExit("Story Plan is missing.")

          plan = json.loads(path.read_text(encoding="utf-8-sig"))
          parts = plan.get("parts")
          counts = plan.get("actual_scene_counts")

          if plan.get("scenes_min") != minimum:
              raise SystemExit("Story Plan SCENES minimum differs from input.")

          if plan.get("scenes_max") != maximum:
              raise SystemExit("Story Plan SCENES maximum differs from input.")

          if plan.get("scenes_range") != [minimum, maximum]:
              raise SystemExit("Story Plan SCENES range metadata is invalid.")

          if not isinstance(parts, list) or not parts:
              raise SystemExit("Story Plan has no Parts.")

          actual = []
          for index, part in enumerate(parts, start=1):
              scenes = part.get("scenes") if isinstance(part, dict) else None
              if not isinstance(scenes, list):
                  raise SystemExit(f"Part {index} has no valid Scene list.")

              count = len(scenes)
              if not minimum <= count <= maximum:
                  raise SystemExit(
                      f"Part {index} has {count} Scenes; "
                      f"configured range is {minimum}-{maximum}."
                  )

              if part.get("main_scene_count") != count:
                  raise SystemExit(
                      f"Part {index} main_scene_count does not match its Scenes."
                  )

              actual.append(count)

          if counts != actual:
              raise SystemExit(
                  "Story Plan actual_scene_counts does not match Part Scene lists."
              )

          print("SCENES RANGE VERIFIED:", f"{minimum}-{maximum}")
          print("PART SCENE COUNTS:", ", ".join(map(str, actual)))
          PY

      - name: Verify actual PARTS selection
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from scripts.input_config import (
              load_and_validate,
              get_format,
              get_parts_range,
              get_parts,
              get_selected_parts_record,
          )

          config = load_and_validate("Input/topic.txt")
          mode = get_format(config)
          minimum, maximum = get_parts_range(config)
          actual = get_parts(config)
          record = get_selected_parts_record(config)

          if not minimum <= actual <= maximum:
              raise SystemExit("Actual PARTS is outside configured range.")

          if record is None:
              raise SystemExit("PARTS selection record is missing.")

          if record.get("selected_parts") != actual:
              raise SystemExit("PARTS selection record is inconsistent.")

          if record.get("format") != mode:
              raise SystemExit("PARTS selection FORMAT mismatch.")

          print("FORMAT:", mode)
          print("ACTUAL PARTS:", actual)
          print("PARTS RANGE:", minimum, "-", maximum)
          PY

